<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rainer Morales, profesional de IA para negocios digitales. Portafolio de proyectos y contacto.">
<title>Rainer Morales · IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --navy: #0a2540;
    --navy-2: #13365c;
    --accent: #00d4aa;
    --accent-ink: #007a63;      /* acento oscurecido para texto sobre blanco */
    --accent-soft: #e6fbf6;
    --bg: #ffffff;
    --surface: #f5f8fb;         /* gris con leve sesgo azul */
    --line: #e1e8ef;
    --text: #0a2540;
    --muted: #51657a;
    --radius: 14px;
    --maxw: 1140px;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
  p { margin: 0; }
  a { color: inherit; }
  button, input, textarea { font: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: 24px; }
  @media (max-width: 480px) { .wrap { padding-inline: 16px; } }

  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent-ink);
  }

  /* ---------- Navegación ---------- */
  .nav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
    background: rgba(255,255,255,0.9); backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 17px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px; background: var(--navy); color: var(--accent);
    display: grid; place-items: center; font-size: 13px; font-weight: 800; letter-spacing: 0.02em;
  }
  .nav-links { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; }
  .nav-links a {
    display: block; padding: 8px 14px; border-radius: 8px; text-decoration: none;
    font-weight: 500; font-size: 15px; color: var(--muted); transition: color .15s, background .15s;
  }
  .nav-links a:hover { color: var(--navy); background: var(--surface); }
  .nav-links a[aria-current="page"] { color: var(--navy); background: var(--accent-soft); }
  .menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; width: 42px; height: 42px; cursor: pointer; color: var(--navy); }
  .menu-btn svg { display: block; margin: auto; }
  @media (max-width: 720px) {
    .menu-btn { display: block; }
    .nav-links {
      display: none; position: absolute; left: 0; right: 0; top: 68px; flex-direction: column;
      background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 16px 16px;
    }
    .nav-links.open { display: flex; }
    .nav-links a { padding: 12px 14px; }
  }

  /* ---------- Botones ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 10px;
    font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; border: 1px solid transparent;
    transition: transform .15s, background .15s, box-shadow .15s;
  }
  .btn-primary { background: var(--accent); color: var(--navy); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,212,170,.35); }
  .btn-ghost { background: transparent; color: var(--navy); border-color: var(--line); }
  .btn-ghost:hover { border-color: var(--navy); }
  .btn-light { background: transparent; color: #fff; border-color: rgba(255,255,255,.3); }
  .btn-light:hover { border-color: var(--accent); color: var(--accent); }

  main { min-height: 70vh; }
  .page { animation: fadeUp .35s ease both; }
  @keyframes fadeUp { from { transform: translateY(8px); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .page { animation: none; } html { scroll-behavior: auto; } .btn { transition: none; } }

  /* ---------- Inicio: hero ---------- */
  .hero { padding-block: 72px 80px; }
  .hero-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 56px; align-items: center; }
  .hero h1 { font-size: clamp(36px, 5.2vw, 60px); font-weight: 800; margin-block: 16px 20px; }
  .hero h1 .hl { color: var(--navy); background: linear-gradient(transparent 62%, rgba(0,212,170,.45) 62%); }
  .hero-lead { font-size: 19px; color: var(--muted); max-width: 34em; }
  .hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 36px; font-size: 14px; color: var(--muted); }
  .hero-meta span { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }

  .photo {
    position: relative; width: 100%; max-width: 420px; aspect-ratio: 4 / 5; margin-left: auto;
    border-radius: 20px; background: var(--navy); overflow: hidden;
    display: grid; place-items: center; color: #fff;
  }
  .photo::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(0,212,170,.28) 1px, transparent 1px);
    background-size: 18px 18px; mask-image: linear-gradient(160deg, #000 20%, transparent 75%);
  }
  .photo-inner { position: relative; text-align: center; padding: 24px; }
  .photo-initials {
    width: 112px; height: 112px; border-radius: 50%; margin: 0 auto 18px;
    border: 2px dashed rgba(0,212,170,.7); display: grid; place-items: center;
    font-size: 36px; font-weight: 800; color: var(--accent);
  }
  .photo-inner small { display: block; font-size: 13px; color: rgba(255,255,255,.7); }
  .photo-tag {
    position: absolute; left: 16px; bottom: 16px; right: 16px; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 12px 14px; font-size: 13px;
    display: flex; align-items: center; gap: 10px; color: #fff;
  }

  /* ---------- Bio ---------- */
  .section { padding-block: 80px; }
  .section-alt { background: var(--surface); border-block: 1px solid var(--line); }
  .bio-grid { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 56px; }
  .bio-grid h2 { font-size: clamp(28px, 3.4vw, 38px); font-weight: 700; margin-top: 12px; }
  .bio-text { display: grid; gap: 18px; font-size: 17px; color: var(--muted); max-width: 40em; }
  .bio-text strong { color: var(--navy); font-weight: 600; }

  .areas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 56px; }
  .area { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 10px; align-content: start; }
  .area-icon { width: 42px; height: 42px; border-radius: 10px; background: var(--navy); display: grid; place-items: center; color: var(--accent); }
  .area h3 { font-size: 18px; font-weight: 600; margin-top: 6px; }
  .area p { color: var(--muted); font-size: 15px; }

  .cta-band { background: var(--navy); color: #fff; border-radius: 20px; padding: 48px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; }
  .cta-band h2 { font-size: clamp(24px, 3vw, 32px); font-weight: 700; }
  .cta-band p { color: rgba(255,255,255,.72); margin-top: 8px; }

  /* ---------- Proyectos ---------- */
  .page-head { padding-block: 64px 40px; }
  .page-head h1 { font-size: clamp(34px, 4.6vw, 52px); font-weight: 800; margin-top: 12px; }
  .page-head p { color: var(--muted); font-size: 18px; margin-top: 14px; max-width: 38em; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  .chip-btn { border: 1px solid var(--line); background: var(--bg); color: var(--muted); padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .chip-btn:hover { border-color: var(--navy); color: var(--navy); }
  .chip-btn[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding-bottom: 88px; }
  .card {
    display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; text-decoration: none; color: inherit; transition: transform .18s, box-shadow .18s, border-color .18s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(10,37,64,.10); border-color: #cbd6e1; }
  .card-cover { aspect-ratio: 16 / 9; background: var(--navy); position: relative; overflow: hidden; }
  .card-cover svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card-body { padding: 22px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card-cat { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
  .card h3 { font-size: 19px; font-weight: 700; overflow-wrap: anywhere; }
  .card p { color: var(--muted); font-size: 15px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 8px; }
  .tag { font-size: 12px; font-weight: 500; background: var(--surface); border: 1px solid var(--line); padding: 3px 9px; border-radius: 6px; color: var(--muted); }
  .card-link { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; color: var(--navy); padding-top: 6px; }
  .card:hover .card-link { color: var(--accent-ink); }
  .badge-featured { position: absolute; top: 12px; left: 12px; background: var(--accent); color: var(--navy); font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 6px; letter-spacing: .04em; text-transform: uppercase; }

  /* ---------- Detalle de proyecto ---------- */
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 15px; }
  .back:hover { color: var(--navy); }
  .detail-head { padding-block: 40px 32px; }
  .detail-head h1 { font-size: clamp(28px, 4vw, 44px); font-weight: 800; margin-top: 14px; overflow-wrap: anywhere; }
  .detail-head p { color: var(--muted); font-size: 18px; margin-top: 14px; max-width: 42em; }
  .detail-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 28px; }
  .meta-item { border-top: 2px solid var(--line); padding-top: 12px; }
  .meta-item dt { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .meta-item dd { margin: 4px 0 0; font-weight: 600; }

  /* ---------- Dashboard Huawei (prefijo .hd-) ---------- */
  .hd { display: grid; gap: 18px; margin-block: 8px 48px; font-variant-numeric: tabular-nums; min-width: 0; }
  .hd > * { min-width: 0; }
  .hd-header {
    background: var(--navy); color: #fff; border-radius: 18px; padding: 28px 30px;
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 20px;
    position: relative; overflow: hidden;
  }
  .hd-header::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .hd-title { flex: 1 1 420px; min-width: 0; }
  .hd-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .hd-title h2 { font-size: clamp(22px, 2.6vw, 28px); font-weight: 700; margin-top: 6px; }
  .hd-title p { font-size: 14px; color: rgba(255,255,255,.75); margin-top: 8px; max-width: 42em; line-height: 1.55; }
  .hd-meta { display: grid; gap: 12px; justify-items: end; flex: 0 1 auto; }
  .hd-badge { font-size: 12px; font-weight: 600; background: rgba(0,212,170,.16); color: var(--accent); padding: 5px 12px; border-radius: 999px; }
  .hd-filters { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
  .hd-filter { display: grid; gap: 4px; font-size: 12px; color: rgba(255,255,255,.7); }
  .hd-filter select {
    font: inherit; font-size: 14px; color: #fff; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.22); border-radius: 8px; padding: 8px 10px; min-width: 96px; cursor: pointer;
  }
  .hd-filter select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,170,.25); }
  .hd-filter option { color: var(--navy); background: #fff; }

  .hd-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .hd-kpi { border: 1px solid var(--line); border-top: 4px solid var(--k); border-radius: var(--radius); padding: 20px 22px; background: var(--bg); display: flex; flex-direction: column; }
  .hd-kpi-label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .hd-kpi-name { font-size: 15px; font-weight: 600; margin-top: 2px; line-height: 1.35; }
  .hd-kpi-value { display: flex; align-items: baseline; gap: 8px; margin-top: 14px; }
  .hd-kpi-value strong { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .hd-kpi-value span { font-size: 14px; color: var(--muted); }
  .hd-kpi-status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; }
  .hd-sem { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; color: #fff; }
  .hd-sem.rojo { background: #d9362d; }
  .hd-sem.amarillo { background: #e5a221; color: #3a2c00; }
  .hd-sem.verde { background: #1f9d55; }
  .hd-delta { font-size: 13px; color: var(--muted); }
  .hd-delta.up { color: #1f7a48; }
  .hd-delta.down { color: #b32d25; }
  .hd-goal { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .hd-goal b { color: var(--navy); }
  .hd-track { height: 8px; background: var(--surface); border-radius: 6px; margin-top: 8px; overflow: hidden; }
  .hd-track div { height: 100%; border-radius: 6px; }
  .hd-owner { margin-top: auto; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); line-height: 1.5; }
  .hd-kpi .hd-owner { margin-top: 14px; }
  .hd-owner span { opacity: .85; }
  .hd-empty { color: var(--muted); padding: 20px; grid-column: 1 / -1; }

  .hd-row { display: grid; gap: 18px; }
  .hd-row-main { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .hd-row-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hd-panel { border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; background: var(--bg); min-width: 0; }
  .hd-panel h3 { font-size: 15px; font-weight: 700; }
  .hd-sub { font-size: 13px; color: var(--muted); margin: 4px 0 14px; line-height: 1.45; }
  .hd-canvas { position: relative; height: 260px; }
  .hd-canvas-lg { height: 340px; }

  .hd-legend { display: grid; gap: 14px; margin-top: 12px; }
  .hd-legend > div { display: flex; gap: 10px; align-items: flex-start; }
  .hd-legend i { width: 12px; height: 12px; border-radius: 50%; flex: none; margin-top: 4px; }
  .hd-legend p { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .hd-legend b { color: var(--navy); }
  .hd-alert { border-top: 1px dashed var(--line); padding-top: 14px; }
  .hd-alert p { border-left: 3px solid #e5a221; padding-left: 10px; }

  .hd-table-wrap { overflow: auto; max-height: 440px; border: 1px solid var(--line); border-radius: 10px; }
  .hd-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .hd-table th {
    position: sticky; top: 0; background: var(--surface); text-align: left; padding: 10px 12px; white-space: nowrap;
    font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--line); cursor: pointer; user-select: none;
  }
  .hd-table th:hover, .hd-table th[aria-sort="ascending"], .hd-table th[aria-sort="descending"] { color: var(--navy); }
  .hd-table td { padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .hd-table tbody tr:hover { background: var(--surface); }
  .hd-pill { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: middle; }
  .hd-foot { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }

  @media (max-width: 960px) {
    .hd-row-main, .hd-row-3 { grid-template-columns: minmax(0, 1fr); }
    .hd-meta { justify-items: start; }
    .hd-filters { justify-content: flex-start; }
  }
  @media (max-width: 860px) {
    .hd-kpis { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 600px) {
    .hd-header { padding: 22px 20px; }
    .hd-panel, .hd-kpi { padding: 18px 16px; }
    .hd-canvas { height: 240px; }
    .hd-canvas-lg { height: 300px; }
    .hd-filters { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
    .hd-filter:last-child { grid-column: 1 / -1; }
    .hd-filter select { width: 100%; }
    .hd-meta { width: 100%; }
  }

  .detail-body { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding-bottom: 88px; }
  .detail-body h2 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .detail-body p, .detail-body li { color: var(--muted); }
  .detail-body ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

  /* ---------- Dashboard FCC (prefijo .fc-, reutiliza .hd-) ---------- */
  .fc-header { flex-direction: column; align-items: stretch; }
  .fc-header .hd-title { flex: none; }
  .fc-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; font-size: 13px; color: rgba(255,255,255,.8); }
  .fc-legend span { display: inline-flex; align-items: center; gap: 8px; }
  .fc-sw { width: 18px; height: 4px; border-radius: 2px; display: inline-block; }
  .fc-sw-dash { background: repeating-linear-gradient(90deg, #00d4aa 0 6px, transparent 6px 10px); }
  .fc-filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 12px; align-items: end; }
  .fc-filters .hd-filter select { width: 100%; min-width: 0; }
  .fc-count { justify-self: end; white-space: nowrap; }

  .fc-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
  .fc-kpi { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; background: var(--bg); display: flex; flex-direction: column; gap: 4px; }
  .fc-kpi-value { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; margin-top: 6px; }
  .fc-kpi-cap { font-size: 12px; color: var(--muted); }
  .fc-delta { font-size: 13px; font-weight: 600; margin-top: 6px; }
  .fc-delta.good { color: #1f7a48; }
  .fc-delta.bad { color: #b32d25; }
  .fc-kpi-sub { font-size: 12px; color: var(--muted); margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--line); }
  .fc-kpi-sub b { color: var(--navy); }

  .fc-panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 20px; }
  .fc-panel-head > div { flex: 1 1 320px; min-width: 0; }
  .fc-select { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .fc-select select {
    font: inherit; font-size: 14px; color: var(--navy); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; max-width: 100%; cursor: pointer;
  }
  .fc-select select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,170,.2); }
  .fc-toggle {
    font: inherit; font-size: 14px; font-weight: 600; color: var(--navy); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap;
  }
  .fc-toggle:hover { border-color: var(--navy); }

  .fc-mini-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .fc-mini { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .fc-mini-title { font-size: 12px; font-weight: 500; color: var(--muted); line-height: 1.25; min-height: 30px; }
  .fc-mini-canvas { position: relative; height: 80px; margin-top: 6px; }

  .fc-canvas-bureau { height: 480px; }
  .fc-row-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fc-num { text-align: right !important; }
  .fc-pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .fc-pill.real { background: rgba(47,111,214,.12); color: #2458ad; }
  .fc-pill.fore { background: var(--accent-soft); color: var(--accent-ink); }

  @media (max-width: 1060px) {
    .fc-mini-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 960px) {
    .fc-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fc-filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fc-count { grid-column: 1 / -1; justify-self: start; }
    .fc-row-2 { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 600px) {
    .fc-filters { grid-template-columns: minmax(0, 1fr); }
    .fc-filters .hd-filter:last-child { grid-column: auto; }
    .fc-mini-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fc-kpi-value { font-size: 30px; }
    .fc-canvas-bureau { height: 560px; }
    .fc-select, .fc-select select { width: 100%; }
  }
  @media (max-width: 400px) {
    .fc-kpis { grid-template-columns: minmax(0, 1fr); }
  }

  /* ---------- Contacto ---------- */
  .contact-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 48px; padding-bottom: 88px; align-items: start; }
  .form { background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 32px; display: grid; gap: 18px; box-shadow: 0 10px 30px rgba(10,37,64,.05); }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 14px; font-weight: 600; }
  .field input, .field textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--bg); color: var(--text);
    font-size: 15px; transition: border-color .15s, box-shadow .15s;
  }
  .field textarea { min-height: 140px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0,212,170,.18); }
  .field .err { font-size: 13px; color: #c0392b; }
  .field [aria-invalid="true"] { border-color: #c0392b; }
  .form-note { font-size: 13px; color: var(--muted); }
  .success { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 16px 18px; font-size: 15px; }
  .success strong { display: block; margin-bottom: 4px; }

  .side { display: grid; gap: 16px; }
  .side-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: grid; gap: 6px; }
  .side-card .label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .side-card .value { font-weight: 600; font-size: 16px; user-select: all; overflow-wrap: anywhere; }
  .copy { justify-self: start; background: none; border: none; padding: 0; color: var(--accent-ink); font-weight: 600; font-size: 14px; cursor: pointer; }
  .social { display: grid; gap: 10px; }
  .social a {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-radius: 12px;
    border: 1px solid var(--line); text-decoration: none; font-weight: 600; transition: border-color .15s, background .15s;
  }
  .social a:hover { border-color: var(--navy); background: var(--surface); }
  .social a span { display: inline-flex; align-items: center; gap: 12px; }
  .avail { background: var(--navy); color: #fff; border-color: var(--navy); }
  .avail .label { color: rgba(255,255,255,.65); }

  /* ---------- Footer ---------- */
  footer { border-top: 1px solid var(--line); padding-block: 28px; font-size: 14px; color: var(--muted); }
  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
  .foot nav { display: flex; gap: 18px; }
  .foot a { text-decoration: none; }
  .foot a:hover { color: var(--navy); }

  /* ---------- Responsive ---------- */
  @media (max-width: 960px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .areas { grid-template-columns: 1fr 1fr; }
    .areas .area:last-child { grid-column: 1 / -1; }
  }
  @media (max-width: 820px) {
    .hero { padding-block: 44px 56px; }
    .hero-grid, .bio-grid, .contact-grid, .detail-body { grid-template-columns: 1fr; gap: 36px; }
    .photo { margin-inline: auto; max-width: 340px; }
  }
  @media (max-width: 600px) {
    .grid, .areas { grid-template-columns: 1fr; }
    .areas .area:last-child { grid-column: auto; }
    .row-2 { grid-template-columns: 1fr; }
    .detail-meta { grid-template-columns: 1fr; }
    .section { padding-block: 56px; }
    .cta-band { padding: 32px 24px; }
    .form { padding: 22px; }
    .hero-lead { font-size: 17px; }
  }
</style>

function hdSemaforo(v) {
  if (v <= 40) return { label: "Rojo", cls: "rojo", color: "#d9362d" };
  if (v <= 70) return { label: "Amarillo", cls: "amarillo", color: "#e5a221" };
  return { label: "Verde", cls: "verde", color: "#1f9d55" };
}

const hdBands = {
  id: "semaforoBands",
  beforeDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    if (!chartArea) return;
    const y = scales.y;
    [[0, 40, "rgba(217,54,45,0.06)"], [40, 70, "rgba(229,162,33,0.08)"], [70, 100, "rgba(31,157,85,0.08)"]].forEach(([a, b, c]) => {
      const top = y.getPixelForValue(b), bottom = y.getPixelForValue(a);
      ctx.save(); ctx.fillStyle = c;
      ctx.fillRect(chartArea.left, top, chartArea.right - chartArea.left, bottom - top);
      ctx.restore();
    });
  },
};

/* Crea o recrea un gráfico de Chart.js sobre un <canvas> */
function useChart(ref, build, deps) {
  useEffect(() => {
    if (!ref.current || !window.Chart) return;
    const chart = new window.Chart(ref.current.getContext("2d"), build());
    return () => chart.destroy();
  }, deps);
}

function hdLineOpts(extraScales, legendSize = 10) {
  return {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: "index", intersect: false },
    plugins: { legend: { position: "bottom", labels: { boxWidth: 10, boxHeight: 10, font: { size: legendSize } } } },
    scales: extraScales,
  };
}

/* =====================================================================
   DASHBOARD · Pulso de Transformación FCC (2013-Q3 a 2016-Q4)
   ---------------------------------------------------------------------
   Componente React basado en Dashboard_FCC.html. Los datos viven en
   <script id="fcc-data" type="application/json"> al final de la página.
   Reutiliza los estilos .hd- del dashboard Huawei y agrega los .fc-
   ===================================================================== */
let FCC_CACHE = null;
function fccData() {
  if (!FCC_CACHE) FCC_CACHE = JSON.parse(document.getElementById("fcc-data").textContent);
  return FCC_CACHE;
}

const FCC_REAL = "#2f6fd6";
const FCC_FORE = "#00a383";
const FCC_ALT = "#0a2540";
const FCC_ROLES = { program_staff: "Personal de programa", IT_staff: "Personal de TI", policy_analyst: "Analista de políticas", administrative: "Administrativo", field_operations: "Operaciones de campo" };
const FCC_EMP = { federal_employee: "Empleado federal", contractor: "Contratista" };
const FCC_PHASE = { inventory: "Inventario", consolidation: "Consolidación", migration: "Migración", optimization: "Optimización" };
const FCC_KPIS = ["employee_engagement_score", "change_readiness_index", "security_posture_score", "digital_tool_adoption_score"];

const fccMean = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
const fccFmt = v => (v === null || v === undefined ? "—" : v.toFixed(2));
const fccBureau = b => b.replace(/^Office_of_/, "Of. ").replace(/_/g, " ");

function fccByPeriod(periods, rows, key) {
  const map = {};
  periods.forEach(p => (map[p] = []));
  rows.forEach(r => { if (map[r.period_quarter]) map[r.period_quarter].push(r[key]); });
  return periods.map(p => ({ period: p, mean: fccMean(map[p]), n: map[p].length }));
}

/* Divide la serie en tramo real y tramo pronosticado, unidos en el último trimestre real */
function fccLineSets(agg, firstF, compact) {
  const v = agg.map(a => a.mean);
  const real = v.map((x, i) => (i < firstF ? x : null));
  const fore = v.map((x, i) => (i >= firstF - 1 ? x : null));
  return [
    { label: "Real", data: real, borderColor: FCC_REAL, backgroundColor: FCC_REAL, borderWidth: compact ? 1.75 : 2.25,
      pointRadius: compact ? 0 : c => (c.dataIndex === firstF - 1 ? 0 : 3), tension: 0.25 },
    { label: "Pronóstico", data: fore, borderColor: FCC_FORE, backgroundColor: FCC_FORE, borderWidth: compact ? 1.75 : 2.25,
      borderDash: [6, 4], pointRadius: compact ? 0 : 3, tension: 0.25 },
  ];
}

function FccMini({ metric, rows, periods, firstF }) {
  const ref = React.useRef(null);
  useChart(ref, () => ({
    type: "line",
    data: { labels: periods, datasets: fccLineSets(fccByPeriod(periods, rows, metric.key), firstF, true) },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fccFmt(c.parsed.y)}` } } },
      scales: { x: { display: false }, y: { display: false } },
    },
  }), [rows, metric.key]);
  return (
    <div className="fc-mini">
      <div className="fc-mini-title">{metric.label}</div>
      <div className="fc-mini-canvas"><canvas ref={ref} role="img" aria-label={"Tendencia de " + metric.label}></canvas></div>
    </div>
  );
}

function FccDashboard() {
  const D = fccData();
  const { periods, forecastPeriods, metrics, records, bureaus, roles, empTypes, cloudPhases } = D;
  const fSet = new Set(forecastPeriods);
  const firstF = periods.findIndex(p => fSet.has(p));
  const lastRealP = periods[firstF - 1];

  const [f, setF] = useState({ bureau: "all", role: "all", emp: "all", phase: "all" });
  const [metric, setMetric] = useState("employee_engagement_score");
  const [bMetric, setBMetric] = useState("employee_engagement_score");
  const [asTable, setAsTable] = useState(false);
  const upd = k => e => setF(s => ({ ...s, [k]: e.target.value }));

  const rows = React.useMemo(() => records.filter(r =>
    (f.bureau === "all" || r.bureau_office === f.bureau) &&
    (f.role === "all" || r.role_category === f.role) &&
    (f.emp === "all" || r.employee_type === f.emp) &&
    (f.phase === "all" || r.cloud_migration_phase === f.phase)
  ), [f]);

  const meta = metrics.find(m => m.key === metric);
  const bMeta = metrics.find(m => m.key === bMetric);
  const agg = fccByPeriod(periods, rows, metric);

  const mainRef = React.useRef(null), bRef = React.useRef(null), roleRef = React.useRef(null), phaseRef = React.useRef(null), detRef = React.useRef(null);

  useChart(mainRef, () => ({
    type: "line",
    data: { labels: periods, datasets: fccLineSets(agg, firstF, false) },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { labels: { usePointStyle: true, boxWidth: 8, boxHeight: 8 } },
        tooltip: { callbacks: { label: c => (c.parsed.y === null ? null : `${c.dataset.label}: ${c.parsed.y.toFixed(2)}`) } },
      },
      scales: { x: { grid: { display: false } } },
    },
  }), [rows, metric]);

  useChart(detRef, () => ({
    type: "bar",
    data: { labels: periods, datasets: [
      { label: "Real", data: agg.map(a => (fSet.has(a.period) ? null : a.mean)), backgroundColor: FCC_REAL, borderRadius: 4, maxBarThickness: 34 },
      { label: "Pronóstico", data: agg.map(a => (fSet.has(a.period) ? a.mean : null)), backgroundColor: FCC_FORE, borderRadius: 4, maxBarThickness: 34 },
    ] },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { labels: { usePointStyle: true, boxWidth: 8, boxHeight: 8 } },
        tooltip: { callbacks: { label: c => (c.parsed.y === null ? null : `${c.dataset.label}: ${c.parsed.y.toFixed(2)} (n=${agg[c.dataIndex].n})`) } },
      },
      datasets: { bar: { skipNull: true } },
      scales: { x: { grid: { display: false } } },
    },
  }), [rows, metric, asTable]);

  useChart(bRef, () => {
    const by = {};
    bureaus.forEach(b => (by[b] = { real: [], fore: [] }));
    rows.forEach(r => {
      if (!by[r.bureau_office]) return;
      if (r.period_quarter === lastRealP) by[r.bureau_office].real.push(r[bMetric]);
      else if (fSet.has(r.period_quarter)) by[r.bureau_office].fore.push(r[bMetric]);
    });
    const out = bureaus.map(b => ({ b, real: fccMean(by[b].real), fore: fccMean(by[b].fore) }))
      .filter(r => r.real !== null || r.fore !== null)
      .sort((a, b) => (b.real ?? 0) - (a.real ?? 0));
    return {
      type: "bar",
      data: { labels: out.map(r => fccBureau(r.b)), datasets: [
        { label: `Real (${lastRealP})`, data: out.map(r => r.real), backgroundColor: FCC_REAL, borderRadius: 4, maxBarThickness: 16 },
        { label: "Pronóstico (Q2–Q4 prom.)", data: out.map(r => r.fore), backgroundColor: FCC_FORE, borderRadius: 4, maxBarThickness: 16 },
      ] },
      options: {
        indexAxis: "y", responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: "top", labels: { usePointStyle: true, boxWidth: 8, boxHeight: 8 } },
          tooltip: { callbacks: { label: c => (c.parsed.x === null ? null : `${c.dataset.label}: ${c.parsed.x.toFixed(2)}`) } } },
        scales: { y: { grid: { display: false }, ticks: { font: { size: 11 } } } },
      },
    };
  }, [rows, bMetric]);

  const countBars = (ref, keys, labels, field, color) => useChart(ref, () => {
    const c = {}; keys.forEach(k => (c[k] = 0));
    rows.forEach(r => (c[r[field]] = (c[r[field]] || 0) + 1));
    return {
      type: "bar",
      data: { labels: keys.map(k => labels[k] || k), datasets: [{ label: "Registros", data: keys.map(k => c[k]), backgroundColor: color, borderRadius: 5, maxBarThickness: 40 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { grid: { display: false }, ticks: { font: { size: 11 }, maxRotation: 40, autoSkip: false } } } },
    };
  }, [rows]);
  countBars(roleRef, roles, FCC_ROLES, "role_category", FCC_REAL);
  countBars(phaseRef, cloudPhases, FCC_PHASE, "cloud_migration_phase", FCC_ALT);

  const sel = (id, label, value, onChange, opts, map, allLabel) => (
    <label className="hd-filter" htmlFor={id}><span>{label}</span>
      <select id={id} value={value} onChange={onChange}>
        <option value="all">{allLabel}</option>
        {opts.map(o => <option key={o} value={o}>{map ? map[o] || o : fccBureau(o)}</option>)}
      </select>
    </label>
  );

  return (
    <div className="hd fc">
      <header className="hd-header fc-header">
        <div className="hd-title">
          <span className="hd-eyebrow">Pulso de Transformación · FCC</span>
          <h2>Transformación digital y cultura organizacional</h2>
          <p>Serie trimestral 2013-Q3 a 2016-Q4 sobre adopción digital, cultura y preparación al cambio. Los últimos 3 trimestres provienen de un modelo de pronóstico.</p>
          <div className="fc-legend">
            <span><i className="fc-sw" style={{ background: FCC_REAL }}></i>Datos reales</span>
            <span><i className="fc-sw fc-sw-dash"></i>Datos pronosticados</span>
          </div>
        </div>
        <div className="fc-filters">
          {sel("fc-bureau", "Bureau / Oficina", f.bureau, upd("bureau"), bureaus, null, "Todas")}
          {sel("fc-role", "Categoría de rol", f.role, upd("role"), roles, FCC_ROLES, "Todas")}
          {sel("fc-emp", "Tipo de empleado", f.emp, upd("emp"), empTypes, FCC_EMP, "Todos")}
          {sel("fc-phase", "Fase de migración a la nube", f.phase, upd("phase"), cloudPhases, FCC_PHASE, "Todas")}
          <span className="hd-badge fc-count">{rows.length.toLocaleString("es-CR")} registros filtrados</span>
        </div>
      </header>

      {/* KPIs */}
      <section className="fc-kpis">
        {FCC_KPIS.map(key => {
          const m = metrics.find(x => x.key === key);
          const a = fccByPeriod(periods, rows, key);
          const last = a[firstF - 1] ? a[firstF - 1].mean : null;
          const fAvg = fccMean(a.slice(firstF).map(x => x.mean).filter(v => v !== null));
          const delta = last !== null && fAvg !== null ? fAvg - last : null;
          const good = delta !== null && (m.higherIsBetter ? delta >= 0 : delta <= 0);
          return (
            <div className="fc-kpi" key={key}>
              <div className="hd-kpi-label">{m.label}</div>
              <div className="fc-kpi-value">{fccFmt(last)}</div>
              <div className="fc-kpi-cap">Último real · {lastRealP}</div>
              {delta !== null && <div className={"fc-delta " + (good ? "good" : "bad")}>{delta >= 0 ? "▲" : "▼"} {Math.abs(delta).toFixed(2)} vs. último real</div>}
              <div className="fc-kpi-sub">Pronóstico prom. (Q2–Q4 2016): <b>{fccFmt(fAvg)}</b></div>
            </div>
          );
        })}
      </section>

      {/* Tendencia principal */}
      <section className="hd-panel">
        <div className="fc-panel-head">
          <div>
            <h3>{meta.label}</h3>
            <div className="hd-sub">Promedio por trimestre sobre la población filtrada. El tramo pronosticado se muestra en verde azulado discontinuo.</div>
          </div>
          <label className="fc-select"><span>Métrica</span>
            <select id="fc-metric" value={metric} onChange={e => setMetric(e.target.value)}>
              {metrics.map(m => <option key={m.key} value={m.key}>{m.label}</option>)}
            </select>
          </label>
        </div>
        <div className="hd-canvas hd-canvas-lg"><canvas ref={mainRef} role="img" aria-label={"Tendencia de " + meta.label}></canvas></div>
      </section>

      {/* Mini gráficos */}
      <section className="hd-panel">
        <h3>Panorama de todos los indicadores</h3>
        <div className="hd-sub">Cada mini gráfico traza los 14 trimestres; el cambio de color marca el inicio del pronóstico.</div>
        <div className="fc-mini-grid">
          {metrics.map(m => <FccMini key={m.key} metric={m} rows={rows} periods={periods} firstF={firstF} />)}
        </div>
      </section>

      {/* Bureaus */}
      <section className="hd-panel">
        <div className="fc-panel-head">
          <div>
            <h3>Comparación por bureau: real vs. pronóstico</h3>
            <div className="hd-sub">Último trimestre real ({lastRealP}) frente al promedio pronosticado (2016-Q2 a Q4), por bureau.</div>
          </div>
          <label className="fc-select"><span>Métrica</span>
            <select id="fc-bmetric" value={bMetric} onChange={e => setBMetric(e.target.value)}>
              {metrics.map(m => <option key={m.key} value={m.key}>{m.label}</option>)}
            </select>
          </label>
        </div>
        <div className="hd-canvas fc-canvas-bureau"><canvas ref={bRef} role="img" aria-label={"Comparación por bureau de " + bMeta.label}></canvas></div>
      </section>

      {/* Contexto */}
      <section className="hd-row fc-row-2">
        <div className="hd-panel">
          <h3>Fuerza laboral por categoría de rol</h3>
          <div className="hd-sub">Registros trimestrales en la población filtrada.</div>
          <div className="hd-canvas"><canvas ref={roleRef} role="img" aria-label="Registros por categoría de rol"></canvas></div>
        </div>
        <div className="hd-panel">
          <h3>Fase de migración a la nube</h3>
          <div className="hd-sub">Distribución de registros por fase declarada.</div>
          <div className="hd-canvas"><canvas ref={phaseRef} role="img" aria-label="Registros por fase de migración"></canvas></div>
        </div>
      </section>

      {/* Detalle */}
      <section className="hd-panel">
        <div className="fc-panel-head">
          <div>
            <h3>Detalle por trimestre · {meta.label}</h3>
            <div className="hd-sub">Valor promedio de la métrica elegida arriba. Pasa el cursor sobre cada barra para ver el promedio y el tamaño de muestra.</div>
          </div>
          <button type="button" className="fc-toggle" aria-pressed={asTable} onClick={() => setAsTable(t => !t)}>
            {asTable ? "Ver como gráfica" : "Ver como tabla"}
          </button>
        </div>
        {asTable ? (
          <div className="hd-table-wrap">
            <table className="hd-table">
              <thead><tr><th>Periodo</th><th>Origen</th><th className="fc-num">Promedio</th><th className="fc-num">N</th></tr></thead>
              <tbody>{agg.map(a => {
                const isF = fSet.has(a.period);
                return (
                  <tr key={a.period}>
                    <td>{a.period}</td>
                    <td><span className={"fc-pill " + (isF ? "fore" : "real")}>{isF ? "Pronóstico" : "Real"}</span></td>
                    <td className="fc-num">{fccFmt(a.mean)}</td>
                    <td className="fc-num">{a.n}</td>
                  </tr>
                );
              })}</tbody>
            </table>
          </div>
        ) : (
          <div className="hd-canvas"><canvas ref={detRef} role="img" aria-label={"Promedio por trimestre de " + meta.label}></canvas></div>
        )}
      </section>

      <footer className="hd-foot">
        Fuente: FCCData_con_pronostico.csv · n total = {records.length.toLocaleString("es-CR")} registros · Los trimestres 2016-Q2, 2016-Q3 y 2016-Q4 son salida de un modelo predictivo, no observaciones directas.
      </footer>
    </div>
  );
}

/* ---------- Router por hash (#inicio, #proyectos, #contacto, #<id-proyecto>) ---------- */
function useRoute() {
  const read = () => (window.location.hash || "#inicio").slice(1) || "inicio";
  const [route, setRoute] = useState(read);
  useEffect(() => {
    const on = () => { setRoute(read()); window.scrollTo({ top: 0 }); };
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  return route;
}

/* ---------- Página: Contacto ---------- */
const EMAIL = "hola@rainermorales.com"; // Reemplazar por el correo real

function Contact() {
  const [form, setForm] = useState({ nombre: "", email: "", empresa: "", mensaje: "" });
  const [errors, setErrors] = useState({});
  const [sent, setSent] = useState(false);
  const [copied, setCopied] = useState(false);

  const set = k => e => setForm(f => ({ ...f, [k]: e.target.value }));
  const validate = () => {
    const e = {};
    if (!form.nombre.trim()) e.nombre = "Escribe tu nombre.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) e.email = "Escribe un correo válido, por ejemplo nombre@empresa.com.";
    if (form.mensaje.trim().length < 10) e.mensaje = "Cuéntame un poco más (mínimo 10 caracteres).";
    return e;
  };
  const submit = ev => {
    ev.preventDefault();
    const e = validate();
    setErrors(e);
    if (Object.keys(e).length) return;
    // Aquí se conecta el servicio de envío (Formspree, API propia, etc.)
    setSent(true);
  };
  const copy = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1800); };
    try { navigator.clipboard.writeText(EMAIL).then(done, () => {}); } catch (e) {}
  };

  return (
    <div className="page">
      <div className="wrap page-head">
        <span className="eyebrow">Contacto</span>
        <h1>Hablemos de tu proyecto</h1>
        <p>Escríbeme con una idea general de lo que necesitas. Respondo en un plazo de uno a dos días hábiles.</p>
      </div>
      <div className="wrap contact-grid">
        <form className="form" onSubmit={submit} noValidate>
          {sent ? (
            <div className="success" role="status">
              <strong>Gracias, {form.nombre.split(" ")[0]}.</strong>
              Tu mensaje está listo. El envío automático se activará cuando el formulario se conecte a un servicio de correo; mientras tanto puedes escribir directamente a {EMAIL}.
            </div>
          ) : null}
          <div className="row-2">
            <div className="field">
              <label htmlFor="nombre">Nombre</label>
              <input id="nombre" value={form.nombre} onChange={set("nombre")} aria-invalid={!!errors.nombre} autoComplete="name" />
              {errors.nombre && <span className="err">{errors.nombre}</span>}
            </div>
            <div className="field">
              <label htmlFor="email">Correo electrónico</label>
              <input id="email" type="email" value={form.email} onChange={set("email")} aria-invalid={!!errors.email} autoComplete="email" />
              {errors.email && <span className="err">{errors.email}</span>}
            </div>
          </div>
          <div className="field">
            <label htmlFor="empresa">Empresa <span style={{fontWeight:400, color:"var(--muted)"}}>(opcional)</span></label>
            <input id="empresa" value={form.empresa} onChange={set("empresa")} autoComplete="organization" />
          </div>
          <div className="field">
            <label htmlFor="mensaje">Mensaje</label>
            <textarea id="mensaje" value={form.mensaje} onChange={set("mensaje")} aria-invalid={!!errors.mensaje} placeholder="¿Qué te gustaría mejorar con IA?"></textarea>
            {errors.mensaje && <span className="err">{errors.mensaje}</span>}
          </div>
          <div style={{display:"flex", flexWrap:"wrap", alignItems:"center", gap:16}}>
            <button type="submit" className="btn btn-primary">Enviar mensaje <Arrow/></button>
            <span className="form-note">Solo uso tus datos para responderte.</span>
          </div>
        </form>

        <aside className="side">
          <div className="side-card">
            <span className="label">Correo</span>
            <span className="value">{EMAIL}</span>
            <button className="copy" onClick={copy}>{copied ? "Copiado" : "Copiar correo"}</button>
          </div>
          <div className="social">
            <a href="https://www.linkedin.com/" target="_blank" rel="noopener"><span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05C20.6 8.65 21 11.2 21 14.5V21h-4v-5.8c0-1.4-.03-3.2-1.95-3.2-1.95 0-2.25 1.52-2.25 3.1V21H9z"/></svg>
              LinkedIn</span><Ext/></a>
            <a href="https://github.com/" target="_blank" rel="noopener"><span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.39-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg>
              GitHub</span><Ext/></a>
            <a href="https://x.com/" target="_blank" rel="noopener"><span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.2 8.2L23 22h-6.6l-5.2-6.8L5.3 22H2.2l7.7-8.8L1.9 2h6.8l4.7 6.2zm-1.2 18h1.7L7.4 3.9H5.6z"/></svg>
              X / Twitter</span><Ext/></a>
          </div>
          <div className="side-card avail">
            <span className="label">Disponibilidad</span>
            <span className="value" style={{userSelect:"auto"}}>Abierto a consultorías y proyectos desde octubre 2026</span>
          </div>
        </aside>
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const route = useRoute();
  const project = PROJECTS.find(p => p.id === route);
  let view;
  if (route === "proyectos") view = <Projects />;
  else if (route === "contacto") view = <Contact />;
  else if (project) view = <ProjectDetail p={project} />;
  else view = <Home />;
  return (
    <>
      <Nav route={route} />
      <main key={route}>{view}</main>
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
