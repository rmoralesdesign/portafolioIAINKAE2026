<script type="application/json" id="vt-kb">[{"s": "Resumen", "p": 393, "t": "Navegando a través de la transformación digital utilizando la TI bimodal: cómo el cambio de las organizaciones de TI facilita el viaje de transformación digital en Deutsche Bahn Vertrieb GmbH"}, {"s": "Resumen", "p": 393, "t": "(a) Situación a la que se enfrenta: Deutsche Bahn Vertrieb GmbH (DB Vertrieb) es una empresa de ventas que opera como parte del Grupo DB en el sector del transporte de pasajeros. Alrededor del milenio, la firma introdujo canales de venta digitales además de los tradicionales. La creciente visibilidad inherente de los sistemas de TI de DB Vertrieb para el cliente requería una función de TI flexible y rápida. Quince años después, la importancia y la omnipresencia de las TI explicaron la necesidad de integrar todas las partes, tradicionales y digitales, de la estrategia de canal de DB Vertrieb para permitir una experiencia de cliente omnicanal fluida."}, {"s": "Resumen", "p": 393, "t": "(b) Acción tomada: La empresa reorganizó su división de TI en dos ocasiones. En primer lugar, estableció una segunda función de TI dentro de su división de canales online y móviles. La nueva unidad de TI era pequeña y flexible, e incorporaba una cultura de start-up. El enfoque de TI bimodal separado por divisiones duró unos 15 años antes de que ambas funciones se reintegraran dentro de la nueva división digital de la empresa. DB Vertrieb también introdujo un marco para escalar el enfoque ágil de la antigua TI en línea al nivel corporativo."}, {"s": "Resumen", "p": 393, "t": "(c) Resultados obtenidos: El diseño informático bimodal permitió a la empresa implementar cambios rápidamente en los canales online y móvil. Sin embargo, la configuración también provocó diferencias culturales entre las dos unidades de TI, lo que impidió la colaboración deseable. Después de la reestructuración en una sola unidad de TI de la división digital, las estrategias que abarcaron los canales fueron posibles y DB Vertrieb experimentó un aumento en la motivación y el compromiso de los empleados. No obstante, reunir los modos de funcionamiento lleva más tiempo del esperado, por lo que la nueva configuración seguía careciendo del éxito deseado en términos de resultados tangibles."}, {"s": "Resumen", "p": 394, "t": "(d) Lecciones aprendidas: El caso demuestra cómo la TI bimodal como herramienta puede facilitar la transformación de TI necesaria para lograr la transformación digital de una empresa. Es vital una reevaluación continua del tipo de TI bimodal. Permite a la unidad de TI apoyar a la empresa para satisfacer las necesidades cambiantes de los clientes de la mejor manera posible. Además, ciertos componentes estratégicos, como la estrategia omnicanal, parecen necesitar un tipo específico de TI bimodal. Además, el caso indica qué roles de liderazgo, estilos de capacitación y medidas son fundamentales para una transformación exitosa a través de la TI bimodal y cómo la adaptación de un tipo diferente de TI bimodal ayuda a impulsar los temas centrales de TI."}, {"s": "§1 Introducción", "p": 394, "t": "En la era de la transformación digital de los negocios, la flexibilidad y la velocidad de entrega de TI juegan un papel crucial. Frente a modelos de negocio disruptivos, ciclos de innovación más cortos y respuestas en tiempo real a los requisitos de los clientes, las empresas se ven obligadas a replantearse el modo y el propósito de su unidad de TI. ¿Cómo integrar los nuevos requisitos derivados de la digitalización en las operaciones? ¿Cómo convertirse en un impulsor de la innovación digital? ¿Cómo apoyar mejor a las empresas cuando se satisfacen las necesidades cambiantes de los clientes? —La transformación digital desafía la función de TI de muchas maneras."}, {"s": "§1 Introducción", "p": 394, "t": "Con el fin de hacer frente a estos desafíos, muchas empresas introducen dos modos de entrega de TI (creando así una configuración de TI bimodal; Gartner 2017), uno lo suficientemente ágil como para reaccionar rápidamente a los cambios tecnológicos y del mercado y otro lo suficientemente estable como para operar grandes sistemas de TI y ofrecer servicios de TI tradicionales. Con el objetivo de permitir el equilibrio adecuado entre la exploración y la explotación de TI, las empresas establecen diferentes formas de TI bimodal. Los tipos van desde proyectos de desarrollo ágil individuales dentro de la función de TI hasta una segunda unidad de TI fuera de la TI tradicional (Haffke et al. Año 2017; Horlach y cols. 2017) (ver a menudo no son el fin en sí mismos. Más bien, son pasos hacia una función de TI reintegrada más ágil y global, capaz de ofrecer todo, estabilidad, calidad y flexibilidad a una velocidad razonable, allanando así el camino para una transformación digital exitosa (ver Figs. 1 y 2)."}, {"s": "§1 Introducción", "p": 395, "t": "Este estudio arroja luz sobre las etapas de la transformación de las TI. Examinamos el viaje de transformación de TI de DB Vertrieb junto con la ruta roja dibujada en la Fig. 2 de una configuración de TI bimodal tradicional a una reintegrada. A través de entrevistas con el Director de Información (CIO), el Director Digital (CDO), así como el Jefe de Procesos de Ventas en 2016 y 2017, obtuvimos una visión profunda de las situaciones y los motivos que impulsaron a DB Vertrieb a adoptar diferentes configuraciones de TI bimodales y las acciones tomadas para permitir y facilitar su implementación."}, {"s": "§1 Introducción", "p": 396, "t": "La empresa es una filial del Grupo DB, que opera principalmente en Alemania. Su sede central se encuentra en Frankfurt, Alemania. Los aproximadamente 5800 empleados son responsables de los distintos canales de venta a través de los cuales el grupo vende sus servicios de movilidad. Debido al rápido ritmo de los cambios en los requisitos de los clientes a finales de la década de 1990, la empresa estableció en 1999 una función de TI responsable únicamente de suministrar los canales de venta digitales, como su sitio web y su aplicación móvil (función de TI en línea). Se colocó fuera de la unidad de TI existente, que mantenía los grandes sistemas y procesos necesarios para los canales de ventas tradicionales, incluidos los centros de viajes y las máquinas expendedoras de boletos (función de TI tradicional). La función de TI en línea era pequeña y ágil, capaz de responder rápidamente al entorno digital en constante cambio."}, {"s": "§1 Introducción", "p": 396, "t": "En comparación, la función de TI tradicional se gestionaba de forma más convencional y basada en los costes. La necesidad de una organización que permitiera un enfoque omnicanal, así como la creciente importancia de los canales digitales, dieron lugar a finales de 2015 a la decisión de fusionar las dos funciones de TI en una sola (función de TI reintegrada). La nueva unidad de TI se integró en la división digital, también de reciente creación. Después de casi 2 años de transición, la organización reintegrada ya está completamente configurada y los marcos y roles están definidos. Con los primeros ciclos de lanzamiento planificados dentro de la nueva configuración, DB Vertrieb ahora está listo para probar la efectividad de los cambios en el camino para brindar una excelente experiencia al cliente."}, {"s": "§1 Introducción", "p": 396, "t": "Tomando como guía los caminos de Haffke et al. (2017), comenzamos con la descripción de la situación que condujo a los dos cambios principales en la organización de TI: de un tipo de TI tradicional a uno bimodal separado por divisiones a un tipo de TI reintegrado. A continuación, entramos en detalle sobre las acciones específicas realizadas por la empresa para facilitar los pasos de transformación, seguido de destacar en qué resultó el viaje de transformación bimodal de TI. Al final, extraemos algunas lecciones aprendidas importantes para que los responsables de la toma de decisiones las tengan en cuenta durante su transformación de TI."}, {"s": "§2 Situación a la que se enfrenta", "p": 396, "t": "Justo antes del cambio de milenio, Internet se convirtió en la corriente principal, preparando el terreno para la burbuja de las puntocom e iniciando la era de las tiendas de comercio electrónico independientes. Las grandes empresas comenzaron a probar la viabilidad de los modelos de negocio en línea. Al igual que otros en ese momento, DB Vertrieb ya estaba experimentando con enfoques digitales para vender sus servicios de transporte de pasajeros. La empresa estableció una división separada para las ventas en línea además de sus canales de venta tradicionales, aplicando así un enfoque multicanal (Verhoef et al. 2015). En esta unidad se examinaron diferentes formas de utilizar los teléfonos móviles y las plataformas de venta de entradas online con el fin de implementar nuevos canales digitales de venta al cliente final."}, {"s": "§2 Situación a la que se enfrenta", "p": 396, "t": "La función de TI se organizó en un departamento de TI separado bajo el control del CIO (ver Fig. 3). Al ser un proveedor puro de sistemas para las funciones del canal (Guillemette y Paré 2012), los extensos sistemas de backend de la compañía"}, {"s": "§2 Situación a la que se enfrenta", "p": 397, "t": "y su aprovisionamiento fiable, escalable y seguro era el núcleo de su responsabilidad. Las métricas utilizadas para medir el rendimiento de la función de TI incluían principalmente qué tan bien cumplía con los acuerdos de nivel de servicio y se mantenía dentro de los presupuestos asignados. De acuerdo con estas métricas, el enfoque de gestión de la función de TI está fuertemente orientado hacia la eficiencia de costos. En particular, esto dio lugar a la decisión de proporcionar solo dos versiones al año, lo que inhibió la flexibilidad y la velocidad de la función de TI y la hizo propensa a conflictos sobre la priorización de las solicitudes."}, {"s": "§2 Situación a la que se enfrenta", "p": 397, "t": "Para los canales de venta en línea y móviles, con el contacto directo de sus sistemas de TI con el cliente final, la gestión centrada en los costos de la unidad de TI era un enfoque inviable. \"El cliente final no entiende si una corrección de errores no se implementa hasta 6 meses después\", afirmó el CIO. Además, los rápidos avances tecnológicos aumentaron (y siguen aumentando) el ritmo de los cambios en los requisitos de los clientes. Con el fin de elevar la capacidad de respuesta con respecto a los errores y los nuevos requisitos a un nivel adecuado, la división en línea definió sus necesidades con respecto a la función de TI en un mínimo de al menos seis lanzamientos por año y casi semanalmente días de parches. El departamento de TI existente no fue diseñado ni gestionado para ofrecer esta velocidad. Por lo tanto, la dirección decidió establecer una segunda unidad de TI dentro de la división en línea en 1999."}, {"s": "§2 Situación a la que se enfrenta", "p": 397, "t": "En los últimos años, han aparecido nuevos competidores en el sector del transporte de pasajeros en Alemania. No solo están proporcionando servicios competitivos a DB, como el coche compartido o los autocares de larga distancia, sino que también intentan ocupar la interfaz del cliente ofreciendo plataformas de movilidad digital. Los canales digitales que integran todas las formas de servicios de transporte de pasajeros ofrecen a los clientes un único punto de contacto fácil de usar durante su viaje. En consecuencia, también en DB Vertrieb, los canales de venta online y móvil se convirtieron en algo más que la \"cola del perro\", como describió el CIO sobre la proporción de canales tradicionales y online. Este último, y su función de TI en particular, se hizo cada vez más visible e importante para el negocio principal de toda la empresa. Sin embargo, cuando se trataba de planificar programas para toda la empresa, la parte en línea seguía siendo un subproyecto del programa general."}, {"s": "§2 Situación a la que se enfrenta", "p": 397, "t": "Ni la estructura corporativa ni la del proyecto reflejaban el nuevo papel crítico para el negocio de los canales digitales, lo que provocaba un desajuste entre los recursos y la asignación de requisitos."}, {"s": "§2 Situación a la que se enfrenta", "p": 398, "t": "Además, la omnipresencia de las TI en la vida digital cotidiana de las personas hoy en día da lugar a la necesidad de viajes omnicanal sin interrupciones. La gestión de los recorridos de los clientes en todos los canales es vital, ya que los clientes esperan que las interfaces entre el medio utilizado para vender un producto o servicio sean casi invisibles. Lograr cruces fluidos entre los canales de venta requiere una alineación central de la estrategia. En DB Vertrieb, la configuración organizativa restringía a la empresa a estrategias distintas para los canales de venta en línea y tradicionales e hizo que la incorporación de un enfoque omnicanal en toda la empresa no fuera viable. \"Hasta ahora teníamos silos de TI. Pertenecían a diferentes canales, proporcionando diferentes sistemas. Es por eso que no teníamos [una] [estrategia] omnicanal\", explicó el CDO. La separación de la división de comercio electrónico, incluida su función de TI, por un lado, y la división CIO responsable de proporcionar servicios de TI a los canales de venta"}, {"s": "§2 Situación a la que se enfrenta", "p": 398, "t": "tradicionales, por el otro, se definió justo debajo de la junta ejecutiva. \"Esta estricta separación\", dijo el Jefe de Procesos de Ventas, \"ya ha impedido una estrecha alineación funcional\". Además, se ubicaron divisiones de canal tradicional y online en diferentes edificios, lo que supone un obstáculo adicional para la colaboración y la coordinación eficaces. Ambas configuraciones hicieron que una estrategia omnicanal alineada en todas las divisiones fuera inalcanzable."}, {"s": "§2 Situación a la que se enfrenta", "p": 398, "t": "La configuración organizativa y el enfoque de gestión antes de 2016 limitaron a DB Vertrieb a aprovechar al máximo las oportunidades de la digitalización. Tanto la importancia de los canales de venta digitales como la relevancia de una integración global de todos los canales de venta obligaron a la empresa a dar un gran paso. Con el objetivo de ofrecer la mejor experiencia al cliente en el sector del transporte de pasajeros, la empresa decidió transformar su organización, incluida la reintegración de las dos funciones de TI separadas por divisiones."}, {"s": "§3 Medidas adoptadas", "p": 399, "t": "DB Vertrieb tomó varias medidas en el curso de sus transformaciones de TI (véase la Tabla 1). Con el fin de poder reaccionar adecuadamente a los requisitos de los clientes y a los cambios del mercado, la empresa creó una segunda unidad de TI fuera de la función de TI tradicional en 1999, por lo tanto, aplicando la configuración de TI bimodal separada por divisiones (ver Fig. 4). Para una alineación suficiente, se instaló una gestión de requisitos general dentro de la función de TI tradicional. La idea general era estructurar y gestionar la subdivisión de TI en línea como una empresa emergente. La firma lo asignó en el departamento para los canales de venta online y móvil. Esta configuración permitió una estrecha colaboración entre los empleados de la empresa y de TI (representados por las flechas de dos lados en la Fig. 4)."}, {"s": "§3 Medidas adoptadas", "p": 399, "t": "Por lo tanto, la demanda y la oferta de TI estaban muy bien alineadas y la función de TI en línea se percibió más bien como un socio activo para el negocio en lugar de un proveedor de sistemas. Todo el equipo estaba ubicado y contaba con alrededor de 20 personas al principio. Además, las funciones no estaban totalmente separadas dentro de la unidad. Con el objetivo de trabajar de manera flexible y sin complicaciones, capaz de reaccionar rápidamente a cualquier cambio necesario, la unidad de TI en línea aplicó sus propias reglas y desarrolló su propia cultura. Los gerentes de TI no veían su tarea en apoyar y abastecer el negocio, sino en generar el mayor impacto para el cliente."}, {"s": "§3 Medidas adoptadas", "p": 399, "t": "Tabla 1 Acciones tomadas durante las transformaciones de TI en DB Vertrieb Configuración de TI bimodal separada por Configuración de TI bimodal reintegrada divisiones (1999-2015) (2016-hoy) • Instalación de una pequeña unidad de TI en • Fusión de la unidad de TI Online y línea ubicada en el departamento de canal de Tradicional en la división digital ventas digitales • Inclusión de la estrategia de TI • Establecimiento de una unidad de en la estrategia de digitalización gestión de necesidades generales corporativa • Trabajé con equipos permanentes y propietarios • Laboratorios de innovación de productos (técnicas Scrum) en la función de TI instalados y función de gestión en línea omnicanal • Ampliación gradual de la unidad de TI en línea e • Introducción de los métodos Scaled introducción de subunidades Agile Framework (SAFe), Scrum y DevOps • Entrenó intensamente a los empleados sobre métodos y modelos • Coordinador de transformación contratado • Junta de gobierno establecida"}, {"s": "§3 Medidas adoptadas", "p": 399, "t": "bimodal separada por divisiones en DB Vertrieb A pesar de que Beck y sus colegas escribieron el manifiesto ágil —el componente central de las metodologías ágiles actuales— solo en 2001 (Beck et al. 2001), \"la mentalidad [dentro de la TI Online] ya estaba en ese momento muy cerca de lo que hoy se llama una mentalidad ágil\", afirmó el Jefe de Procesos de Ventas."}, {"s": "§3 Medidas adoptadas", "p": 400, "t": "La división de TI en línea trabajaba con una organización similar a Scrum de equipos permanentes, es decir, equipos instalados permanentemente para cada tema. Un equipo formado por miembros de la parte de TI y del lado empresarial. Además, la función de TI en línea había implementado un papel de propietario de producto bastante autónomo. Según Schwaber y Beedle (2002), el propietario del producto es responsable de la gestión de los requisitos del cliente y de la comunicación con el equipo. En DB Vertrieb, \"teníamos el papel de un propietario de producto bastante poderoso con dos sombreros\", mencionó el CIO. Su responsabilidad se definió más allá de la gestión de requisitos y la comunicación dentro de los equipos permanentes de la división de TI en línea. Además, un propietario de producto era responsable de la alineación de los proyectos que involucraban canales de venta tradicionales, por lo tanto, también la función de TI tradicional."}, {"s": "§3 Medidas adoptadas", "p": 400, "t": "Como gerente de subproyecto dentro de proyectos que abarcan canales, él o ella tenía el \"trabajo muy desafiante\", afirmó el CIO, de coordinar un equipo ágil en una configuración organizativa y un modo de trabajo tradicionales para toda la empresa."}, {"s": "§3 Medidas adoptadas", "p": 400, "t": "Debido a la creciente relevancia de la digitalización para la venta de servicios de transporte de pasajeros a lo largo de los últimos 15 años, las funciones comerciales de DB Vertrieb demandaron cada vez más servicios de la función de TI en línea, alejándose de la función de TI tradicional. La creciente atención de las divisiones de negocio llevó a un aumento de los requisitos dirigidos a la función de TI en línea. Para poder satisfacer la demanda, DB Vertrieb amplió y reorganizó gradualmente la división de TI en línea. Contando con solo 20 personas en sus primeros años, la función de TI en línea creció a 150 empleados a finales de 2015. Además, la empresa introdujo subunidades dentro de la función de TI en línea para administrar la fuerza laboral más grande, así como la creciente demanda."}, {"s": "§3 Medidas adoptadas", "p": 400, "t": "A principios de 2016, DB Vertrieb fusionó sus funciones de TI en línea y tradicional en una sola unidad (TI bimodal reintegrada; ver Fig. 5). La empresa decidió transformar su negocio y su organización de TI de una manera fundamental para perseguir el objetivo general de ofrecer una excelente experiencia al cliente en todo momento bimodal reintegrada en DB Vertrieb"}, {"s": "§3 Medidas adoptadas", "p": 400, "t": "canales de venta. En particular, DB Vertrieb tenía como objetivo aplicar una estrategia omnicanal, ser más innovador con respecto a los canales de venta tradicionales y llevar estas innovaciones al mercado más rápidamente. Con la organización corporativa existente, que incluía una configuración de TI bimodal separada por divisiones, estos objetivos no eran alcanzables."}, {"s": "§3 Medidas adoptadas", "p": 400, "t": "La función de TI reintegrada liderada por el CIO se encuentra dentro de la división digital de la empresa. La división digital es otro resultado de la reorganización. Se estableció para dar cuenta de la importancia de la digitalización para el negocio de DB Vertrieb de vender billetes de transporte y apoyar al cliente durante todo el viaje. Un CDO recientemente anunciado está al frente de la división digital. También forma parte del comité ejecutivo de la empresa con el propósito de mejorar el nivel de comprensión de TI dentro del equipo directivo. En línea con el enfoque en una experiencia del cliente integral, la división digital se estructura de acuerdo con los pasos del recorrido del cliente y se complementa con una unidad de gestión omnicanal general."}, {"s": "§3 Medidas adoptadas", "p": 401, "t": "De la misma manera que la función de TI pasó a formar parte de la división digital, la estrategia de TI pasó a formar parte de la estrategia de digitalización corporativa de DB Vertrieb. \"La unidad [de TI tradicional] dio forma a la estrategia de digitalización de muchas maneras. Especialmente, la gestión de la arquitectura empresarial, así como la gestión de la cartera, estuvieron muy involucradas. Decimos que tiene sentido considerar ambos temas juntos\", explicó el CIO. Por lo tanto, los temas tradicionales de TI, como la sustitución de los sistemas host y los ordenadores centrales, están ahora integrados en la estrategia de digitalización."}, {"s": "§3 Medidas adoptadas", "p": 401, "t": "Casi al mismo tiempo que DB Vertrieb decidió fusionar sus funciones de TI, la empresa también instaló laboratorios de innovación. Estos laboratorios se definen como un centro de competencia, un explorador de innovación y un espacio creativo. En un lugar separado, los laboratorios organizan talleres de pensamiento de diseño e ideación con el fin de promover la innovación y el espíritu empresarial en toda la empresa. Se presta especial atención a fomentar y mejorar la exploración dentro de los canales tradicionales. El mayor impacto de los laboratorios es trabajar en conjunto con unidades de desarrollo de productos y canales de venta muy tradicionales y promover metodologías de innovación, así como discutir nuevas estrategias para acercarse al mercado. Cuando esta colaboración conduzca a un prototipo o maqueta aceptada por el negocio, la función de TI lleva a cabo pruebas de viabilidad y verifica oportunidades de implementación rápida."}, {"s": "§3 Medidas adoptadas", "p": 401, "t": "Además de las unidades de negocio, la propia función de TI reintegrada también utiliza las posibilidades, las instalaciones y la experiencia de los laboratorios. \"Tienen un laboratorio de UX bastante bonito, que usamos con bastante frecuencia\", nombró el Jefe de Procesos de Ventas como ejemplo. Las dos unidades trabajan en estrecha colaboración para mejorar la innovación en los negocios y la TI. El intercambio continuo de conocimientos necesario para la estrecha colaboración se ve facilitado por el hecho de que, debido a la fusión de TI, algunos antiguos empleados de TI en línea aceptaron nuevos puestos dentro de los laboratorios, fortaleciendo los vínculos."}, {"s": "§3 Medidas adoptadas", "p": 401, "t": "Además de la reasignación de la división de TI reintegrada dentro de la configuración organizativa más amplia, DB Vertrieb también comenzó a transformar gradualmente la propia función de TI. El objetivo de la empresa es modificar toda la función de TI de manera que se asemeje a la antigua unidad de TI en línea al ser un socio rápido, flexible y ágil para el negocio, al tiempo que proporciona sistemas y servicios estables y seguros. El CIO especificó las expectativas de la siguiente manera: \"En términos de time-to-market, queremos trabajar en ser cinco veces más rápidos de extremo a extremo. Eso significa que, cuando surge la idea de una campaña de precios, [...] queremos llevarlo a la producción cinco veces más rápido que hoy. Además, está apuntando a ciclos de lanzamiento para la función de TI reintegrada mensualmente para funcionalidades altamente interdependientes y semanalmente para características independientes."}, {"s": "§3 Medidas adoptadas", "p": 401, "t": "Para poder alcanzar estos objetivos paso a paso, la empresa invierte mucho en la nueva configuración organizativa desde la reorganización en 2016. Proporcionó un marco para escalar la agilidad de la división de TI en línea. Además, se ofrecen regularmente cursos de formación sobre métodos y herramientas ágiles a los empleados que anteriormente trabajaban en la función de TI tradicional."}, {"s": "§3 Medidas adoptadas", "p": 402, "t": "Para hacer que el enfoque ágil sea escalable a nivel corporativo, DB Vertrieb decidió implementar el Scaled Agile Framework (SAFe). SAFe es un modelo operacional que especifica reglas y procedimientos para aplicar en configuraciones organizacionales ágiles a mayor escala (Laanti 2014). Se trata de un enfoque de mejores prácticas, que proporciona a DB Vertrieb medidas útiles para abordar los mayores puntos débiles al intentar escalar métodos ágiles. Apoya a la compañía en la canalización de los requisitos de TI y ayuda a \"cómo [DB Vertrieb] puede alcanzar un consenso estratégico entre las unidades de negocio y lograr una priorización conjunta con la que todos se sientan cómodos y que dé a todos la"}, {"s": "§3 Medidas adoptadas", "p": 402, "t": "sensación de que se logró un óptimo general a nivel de grupo\", enfatizó el Jefe de Procesos de Ventas. Además de la escalabilidad, SAFe permite una derivación estricta de estrategias a nivel de grupo. DB Vertrieb tiene que coordinar sus acciones comerciales con otras unidades del grupo y SAFe guía a la empresa en la optimización de esta alineación. Sin embargo, el debate sobre el diseño específico y el grado de adopción de SAFe para DB Vertrieb aún está en curso."}, {"s": "§3 Medidas adoptadas", "p": 402, "t": "Como parte de SAFe, DB Vertrieb también introdujo equipos formales de Scrum (en contraste con la estructura similar a Scrum en la antigua función de TI en línea) y metodologías DevOps para mejorar la integración y evitar el pensamiento de silos dentro de su función de TI reintegrada, así como entre las partes centrales de la cadena de valor de TI. Durante la fase inicial de la reorganización, surgió la pregunta de si un enfoque ágil requiere que todos los equipos participantes sean internos de la empresa, especialmente en lo que respecta a las operaciones de TI. La dirección de DB Vertrieb decidió mantener el modelo, que había estado en vigor, con la gestión técnica de las operaciones de TI proporcionada por el departamento de TI del grupo proveedor de servicios. Con el fin de facilitar la colaboración y lograr una mayor eficiencia entre las dos funciones, la empresa inició un enfoque DevOps."}, {"s": "§3 Medidas adoptadas", "p": 402, "t": "En particular, la unidad de desarrollo de DB Vertrieb ahora integra la unidad de operaciones del proveedor de servicios en una fase anterior del proceso de desarrollo con el objetivo de mejorar la eficacia de la colaboración."}, {"s": "§3 Medidas adoptadas", "p": 402, "t": "Con el fin de preservar y mejorar el espíritu ágil y la cultura de innovación, la empresa realizó grandes inversiones en la organización para reducir las diferencias entre las unidades de TI Online y Tradicional. Además de proporcionar a los antiguos empleados de Online IT un marco para escalar la agilidad de la función, DB Vertrieb ofrece continuamente cursos sobre metodologías ágiles y análisis de negocio. Se ofrecen capacitaciones especiales a aquellos que traen consigo la forma correcta de pensar y las habilidades necesarias para una organización ágil para guiarlos a través de la transformación y mantener su espíritu. Para cerrar aún más la brecha, la empresa también organiza campamentos multifuncionales con el objetivo de promover una mentalidad centrada en el cliente, ágil e innovadora en toda la organización. Todas estas capacitaciones y cursos son obligatorios para garantizar la efectividad y un entendimiento común."}, {"s": "§3 Medidas adoptadas", "p": 402, "t": "Además, con el fin de aliviar el desbordamiento de ideas ágiles y formas de trabajar dentro de los equipos de TI, DB Vertrieb aplica una estrategia de mezcla de empleados. Esto significa que, en su caso, los equipos están formados por antiguos empleados de la unidad de TI en línea y de la unidad de TI tradicional."}, {"s": "§3 Medidas adoptadas", "p": 403, "t": "Un año y medio después del inicio de la reorganización, la firma introdujo recientemente roles adicionales para apoyar la transformación. Dentro de la división digital, se creó el rol de \"director de orquesta\", como el Jefe de Procesos de Ventas denominó al puesto, y se dotó de personal contratando externamente a un experto en desarrollo corporativo con experiencia. Su tarea es \"detectar tendencias y vibraciones y proteger el backlog de transformación para asegurarse de que al menos algunos elementos estén anclados a 'Hecho'\", afirmó la Jefa de Procesos de Ventas. Dado que DB Vertrieb transformó no solo toda su organización, sino también los métodos utilizados, así como la arquitectura implementada, vio la necesidad de un papel explícito para ayudar a la administración. Además, la compañía estableció recientemente una junta de gobernanza de transformación. Su propósito es echar un vistazo a lo que funciona bien y lo que no. Además, decide las medidas adecuadas a tomar a lo largo del"}, {"s": "§3 Medidas adoptadas", "p": 403, "t": "camino de la transformación. La junta permite que la gerencia se tome un tiempo para pensar en la transformación organizacional, así como en su transformación de TI."}, {"s": "§4 Resultados conseguidos", "p": 403, "t": "DB Vertrieb logró sus principales objetivos tanto con la implementación de una configuración de TI bimodal separada por divisiones como con la reintegración de ambas unidades de TI. Al mismo tiempo, sin embargo, surgieron desafíos. En la Tabla 2 se resumen los resultados, que se explican en detalle a continuación, primero en lo que respecta a la configuración de TI separada por divisiones, luego en lo que respecta a la unidad de TI reintegrada."}, {"s": "§4 Resultados conseguidos", "p": 403, "t": "La configuración de TI bimodal separada, implementada en 1999, tenía como objetivo permitir flexibilidad y agilidad para los nuevos canales en línea y, al mismo tiempo, servicios ininterrumpidos, seguros y estables para los canales tradicionales y sistemas de backend existentes. De hecho, la división de TI en línea alcanzó un ritmo de lanzamientos casi semanales. De ocho a diez Tabla 2 Resultados de las transformaciones de TI en DB Vertrieb Configuración de TI bimodal Configuración de TI bimodal reintegrada separada por divisiones (1999-2015) (2016-hoy) Resultados • Función de TI en línea más rápida • Mejor alineación y énfasis en los temas positivos • Soporte adecuado para la de TI estrategia multicanal • Posibilidad de estrategia omnicanal • Fuerte alineación entre el • Impulso del espíritu de equipo y negocio y la TI en la división del la motivación de los empleados canal online • Difusión de la mentalidad ágil Desafíos • La aplicación de métodos • Dificultad para dotar de personal"}, {"s": "§4 Resultados conseguidos", "p": 403, "t": "a los explícitamente ágiles no es nuevos puestos/funciones factible • Inseguridades y sensibilidades • Creciente brecha cultural entre los empleados con respecto a • Aparición de silos de TI y las nuevas medidas desaparición de la • La alta interconexión dificulta mentalidad ágil la implementación de SAFe"}, {"s": "§4 Resultados conseguidos", "p": 403, "t": "de esas versiones por año contenían funcionalidades complejas. En comparación con la función de TI tradicional que funcionaba con dos a cuatro lanzamientos por año, la mayor velocidad era una gran ventaja. La empresa podría responder más fácilmente a los crecientes cambios con respecto a los canales de venta en línea en el mercado del transporte de pasajeros. Por lo tanto, la configuración de TI bimodal con dos unidades de TI bastante independientes permitió un soporte adecuado para cada una de las unidades de canal dentro del enfoque multicanal."}, {"s": "§4 Resultados conseguidos", "p": 404, "t": "La organización de una función de TI dentro de la división de canal en línea tuvo el efecto positivo adicional de que hubo una fuerte alineación entre el negocio y la TI. Las unidades funcionaban bien en el día a día. El impacto en el lado del cliente estuvo en el centro de atención de todos los empleados del canal online. El ambiente fue constructivo y tanto las funciones de negocio como las de TI priorizaron proyectos y funcionalidades de la mano. \"La confianza mutua que existía dentro de la unidad, para alcanzar el óptimo presupuestario mediante el establecimiento de una gestión de proyectos múltiples que funcionara bien, fue simplemente fantástica. Fue un momento increíble allí\", describió el Jefe de"}, {"s": "§4 Resultados conseguidos", "p": 404, "t": "Procesos de Ventas, recordando la buena alineación y vibra en la división de canales online."}, {"s": "§4 Resultados conseguidos", "p": 404, "t": "Por otro lado, trabajar con métodos ágiles explícitos en la función de TI en línea no era factible. A pesar de que tenía equipos permanentes y una mentalidad ágil, no se podían implementar facetas adicionales de los métodos ágiles. La alta interconexión de las ofertas de servicios tradicionales y en línea de DB Vertrieb creó demasiadas interfaces para que la función de TI en línea actuara de manera realmente ágil. Muchos cambios en un canal invocaban cambios en otros canales que eran compatibles con la unidad de TI tradicional. La aplicación de todas las metodologías ágiles, tal y como se describen de forma muy explícita en el enfoque Scrum, por ejemplo, no era factible."}, {"s": "§4 Resultados conseguidos", "p": 404, "t": "Además, los empleados de la unidad de TI tradicional lucharon con la existencia de una segunda TI más ágil y sin complicaciones. A diferencia de la función de TI tradicional, la función de TI en línea tiene los \"temas atractivos\", como los llamó el CIO. Se les permitió actuar de manera diferente y adherirse a diferentes reglas. Las personas que trabajan en la función tradicional de TI \"sintieron que estaban atrapadas con sistemas, procedimientos y procesos, que son versiones agotadas y que no se abordan y abordan de la manera en que uno lo haría hoy\", afirmó el CIO. La cantidad dispar de lanzamientos por año llevó a una incomprensión adicional en ambos lados. La función de TI tradicional no entendía la falta de voluntad de la unidad de TI en línea para integrar las versiones, y la función de TI en línea no veía con buenos ojos el retraso cuando era necesaria la alineación de las versiones entre canales."}, {"s": "§4 Resultados conseguidos", "p": 404, "t": "La pérdida de apreciación experimentada, por un lado, y la falta de comprensión, por el otro, dieron lugar a una creciente brecha cultural entre las dos funciones de TI. Por lo tanto, ambas partes mostraron poca voluntad para la cooperación necesaria."}, {"s": "§4 Resultados conseguidos", "p": 404, "t": "Con la creciente importancia de los canales digitales y la expansión de la unidad de TI en línea, surgieron nuevos desafíos. La gente comenzó a identificarse con sus subunidades. En consecuencia, surgieron silos de TI y la mentalidad y la cultura ágiles comenzaron a desaparecer. Los modelos de colaboración existentes entre las unidades de TI en línea y tradicionales se volvieron menos factibles, ya que los temas en línea ya no eran solo una parte de los proyectos generales del canal de ventas, sino más bien el núcleo. Además, las expectativas del lado comercial se mantuvieron iguales con respecto a la velocidad de la función de TI en línea. Por lo tanto, la gestión de la creciente unidad de TI en línea, que operaba en el corazón del negocio de la empresa pero no era reconocida como tal, y que se presentó como pequeña, rápida y ágil, pero que ahora resultó ser mucho más grande y menos flexible, se volvió cada vez más difícil. Estos desafíos, al final, llevaron a la decisión de fusionar las funciones de TI."}, {"s": "§4 Resultados conseguidos", "p": 405, "t": "En 2016, las expectativas eran altas con respecto a la nueva organización de la empresa y la nueva configuración de la función de TI bimodal reintegrada. La reestructuración de toda la organización tenía el objetivo de centrarse en los temas digitales y permitir un negocio omnicanal sin interrupciones. Con la promoción de la digitalización, la formulación de una estrategia de digitalización que incorpore los problemas centrales de TI y la reorganización de la función de TI como parte de la división digital, la empresa logró la alineación necesaria y un mayor énfasis en los temas de TI en general (Matt et al. 2015). A través de la división digital, liderada por un CDO que forma parte del comité ejecutivo, el CIO como jefe de la unidad de TI reintegrada ahora tiene una mayor atención dentro de la junta ejecutiva. Incluso los ejecutivos con menos afinidad por los temas de TI ahora"}, {"s": "§4 Resultados conseguidos", "p": 405, "t": "muestran una mayor comprensión de los problemas de TI que a menudo se ignoraban antes en el nivel de alta dirección. El CIO describió el nuevo aumento en importancia y su impacto de la siguiente manera: \"El nuevo enfoque me ayuda absolutamente a impulsar los temas del CIO porque todos reconocen que la TI es la base de nuestro negocio futuro.\" La reorganización, centrada en los recorridos de los clientes multicanal y basada en una implementación global de TI, también hizo posible el enfoque omnicanal previsto. El CDO destacó que \"ahora, juntamos [las funciones de TI] porque dijimos, solo puede haber omnicanalidad.\" Al tener una sola función de TI, todos los canales y recorridos de venta, tradicionales y digitales, obtuvieron acceso a la misma experiencia, flexibilidad y velocidad de TI. Los requisitos empresariales ahora se dirigen a una gran función de TI. Las prioridades entre requisitos se agrupan y gestionan mediante la unidad de gestión omnicanal."}, {"s": "§4 Resultados conseguidos", "p": 405, "t": "Las responsabilidades claras y la mayor transparencia permiten una mejor alineación entre el negocio y la TI y una implementación más fácil de los requisitos del cliente en la interfaz del negocio y la TI."}, {"s": "§4 Resultados conseguidos", "p": 405, "t": "Con el fin de facilitar la transformación de los empleados, DB Vertrieb proporcionó y sigue impartiendo formación sobre metodologías y modelos de colaboración que cada uno de los empleados ha impartido y sigue impartiendo formación sobre metodologías y modelos de colaboración que cada uno de los empleados ha llevado a cabo. El empleado tiene que asistir. La obligatoriedad de los cursos dio lugar a un impulso en el espíritu de equipo, la motivación y el estado de ánimo optimista entre los interesados. El Jefe de Procesos de Ventas declaró: \"Este 'enfoque conjunto de un nuevo método' del grupo bastante variopinto de personas de diferentes canales de venta que no siempre participaron voluntariamente en la transformación condujo a una gran cohesión del equipo. [...] La gente incluso comenzó a organizar excursiones por sí misma.\" La comprensión mutua, así como de los distintos usuarios o clientes, y de las necesidades específicas de cada canal de venta aumentó continuamente."}, {"s": "§4 Resultados conseguidos", "p": 405, "t": "El novedoso compromiso de los empleados ayudó a reunir rápidamente equipos interdivisionales que funcionaban bien dentro de la estructura del recorrido del cliente."}, {"s": "§4 Resultados conseguidos", "p": 405, "t": "En cuanto al mantenimiento de la mentalidad ágil en la nueva organización y la superación de la brecha cultural entre las funciones de TI anteriormente separadas, \"la empresa hizo un buen trabajo\", como afirmó el Jefe de Procesos de Ventas. Es difícil escalar una forma ágil de trabajar y la confianza inherente a una división de TI pequeña y ágil. Esto es especialmente cierto para DB Vertrieb, ya que la empresa no solo fusionó sus funciones de TI, sino que también se expandió fuertemente. Sin embargo, la mezcla de equipos, la formación de los empleados de ambas partes y la introducción de campamentos centrados en el cliente, la agilidad y la innovación, hicieron que las personas trabajaran juntas y salvaron algunas partes del espíritu ágil que todavía estaba presente en la función de TI en línea."}, {"s": "§4 Resultados conseguidos", "p": 406, "t": "A pesar de estos resultados positivos, la fusión aún no se ha completado y los efectos disruptivos aún son notables. Durante el primer año y medio de la nueva configuración organizativa, la mayoría de los nuevos puestos fueron dotados de personal. Sin embargo, en algunos casos, la empresa tuvo dificultades para encontrar a las personas adecuadas para el puesto adecuado. Como la definición de algunos puestos y su papel en la nueva configuración aún no estaba clara, la tasa de rotación interna fue alta al principio. \"Tuvimos que vivir con que colegas cuyo rol se volvió más generalista dijeron: 'No quiero esto de ninguna manera; Solo me"}, {"s": "§4 Resultados conseguidos", "p": 406, "t": "veo en [canales] en línea\". Volvieron a aplicar a sus canales conocidos, dejando vacantes los nuevos roles\", recordó el Jefe de Procesos de Ventas. Los puestos que no pudieron ser atendidos de inmediato y que permanecieron vacantes durante algún tiempo tuvieron que ser cubiertos temporalmente con personal externo."}, {"s": "§4 Resultados conseguidos", "p": 406, "t": "Además, a pesar de que el resultado de las capacitaciones condujo a un aumento en el compromiso de los empleados, la realización de estas capacitaciones requirió más tiempo del esperado, así como inversiones considerables. \"Definitivamente subestimamos la intensidad de estas capacitaciones y la internalización de nuevos procedimientos\", afirmó el Jefe de Procesos de Ventas. Especialmente, dentro de la función de TI reintegrada, la ruptura de los diferentes métodos de trabajo y colaboración estancados aún está en curso. Casi 2 años después, DB Vertrieb todavía no está donde esperaba estar."}, {"s": "§4 Resultados conseguidos", "p": 406, "t": "La introducción de SAFe, aunque generalmente guió la gestión y la estrategia, desencadenó inseguridades y sensibilidades entre los empleados de la función de TI reintegrada. Desde la reestructuración, los antiguos empleados de Online IT están luchando con las nuevas reglas vigentes que limitan su autonomía, a la que estaban acostumbrados dentro de la configuración anterior. Los propietarios de productos, en particular, tenían un alto grado de libertad. Con la introducción de SAFe, se requiere la alineación con otras unidades de la organización, restringiendo esta autonomía absoluta. Sin embargo, el marco no solo desafía a los antiguos empleados de TI en línea, sino también a los de la antigua función de TI tradicional. A pesar de que SAFe regula la forma ágil de trabajar en una gran empresa aquellos que están acostumbrados a un enfoque más tradicional en el desarrollo de software se ven sobrecargados a medida que, por ejemplo, la planificación tradicional de hitos se erosiona."}, {"s": "§4 Resultados conseguidos", "p": 406, "t": "Además de los desafíos que conciernen a las personas involucradas, la empresa sigue trabajando en la realización de SAFe dentro de su organización altamente integrada. Los empleados de DB Vertrieb trabajan juntos para, al final, vender entradas a través de varios canales, lo que conduce a muchas interconexiones y a una arquitectura altamente interdependiente. La separación de las nuevas funcionalidades y cambios para el servicio en ciertas partes de la versión de un cierto tamaño, como sugiere SAFe, es muy difícil. DB Vertrieb todavía se encuentra en la fase de \"prueba y error\" para identificar la mejor manera de dividir el contenido de la versión. Esto también se aplica a la decisión sobre la adopción del despliegue continuo, otro aspecto de SAFe, que aún está en curso. La empresa discute si las unidades funcionales realmente necesitan un despliegue continuo. Además, los altos y variados niveles de interdependencias dentro de las versiones impedirían la implementación. Por lo tanto, la gerencia es bastante reacia a adoptarlo."}, {"s": "§4 Resultados conseguidos", "p": 407, "t": "El CIO expresó su evaluación general del progreso de la transformación en una declaración: \"Tenemos que cumplir ahora.\" DB Vertrieb dedicó casi 2 años a la asignación y asignación de funciones, personas y procesos. Aun así, está introduciendo nuevas medidas de gestión. Ahora se lleva a cabo la puesta en marcha, a la espera de que la empresa sea más flexible y ágil para ofrecer una excelente experiencia al cliente que abarque todos los canales. Sin embargo, el tiempo dirá si la transformación produce los resultados esperados, ya que los resultados medibles, como el tiempo de comercialización cinco veces más rápido mencionado por el CIO, aún no son visibles."}, {"s": "§5 Lecciones aprendidas", "p": 407, "t": "La historia de este caso ofrece varias lecciones aprendidas interesantes para las empresas que se enfrentan a retos similares a los de DB Vertrieb. La transformación digital obliga continuamente a las empresas a replantearse el papel de la función de TI corporativa. El caso de DB Vertrieb en su conjunto es un ejemplo ilustrativo a largo plazo de cómo utilizar un enfoque de TI bimodal como herramienta para reorganizar la unidad de TI en su camino a través de la transformación digital. DB Vertrieb lleva a cabo varios pasos en el proceso de transformación bimodal de TI, tal y como se presenta en la Fig. 2. Al hacerlo, la empresa muestra cuándo y cómo cambiar la configuración y el propósito de la función de TI para que la transformación digital sea más fácil de dominar. Los beneficios y desafíos de la implementación de una organización de TI bimodal descritos en este caso proporcionan una guía útil."}, {"s": "§5 Lecciones aprendidas", "p": 407, "t": "Los gerentes pueden aprender a implementar una configuración de TI bimodal de la manera que mejor responda a las necesidades específicas de una empresa mientras se lleva a cabo la transformación digital."}, {"s": "§5 Lecciones aprendidas", "p": 407, "t": "Reevalúe continuamente la elegibilidad de su configuración de TI bimodal: El caso de DB Vertrieb nos enseña a reconsiderar todos los aspectos de la configuración bimodal de la función de TI de forma regular. Hay más de una forma de implementar una organización de TI bimodal. El caso muestra que los diversos tipos de TI bimodal pueden utilizarse como una herramienta para transformar la función de TI. Por lo tanto, no se trata solo de implementar la TI bimodal, sino más bien de qué tipo de TI bimodal es el más adecuado. Y esto puede cambiar con el tiempo. Una configuración de TI bimodal separada por divisiones puede funcionar mejor para respaldar el negocio durante un cierto período de tiempo. Una configuración de TI unimodal reintegrada podría ser adecuada más adelante. Los indicadores de los cambios necesarios pueden provenir de cambios externos en el mercado y la tecnología, así como de ajustes internos en los procesos o en la estrategia (por ejemplo, multicanal frente a omnicanal)."}, {"s": "§5 Lecciones aprendidas", "p": 407, "t": "Las nuevas expectativas de los clientes, los enfoques de ventas innovadores y los cambios en el enfoque empresarial requieren que DB Vertrieb actúe más de una vez en relación con la configuración de TI implementada. Las empresas deben desafiar continuamente la organización bimodal de su función de TI con respecto a su ajuste a los desarrollos y estrategias actuales. A pesar de que el cambio entre tipos de TI bi, multimodal y unimodal es un desafío, una configuración diferente puede superar las limitaciones provocadas por la configuración de TI actual (bimodal)."}, {"s": "§5 Lecciones aprendidas", "p": 408, "t": "La omnicanalidad necesita una función de TI única y ágil: Un desarrollo particularmente relevante en el mercado de DB Vertrieb es la aparición de enfoques omnicanal. Este caso muestra que dos unidades de TI separadas por divisiones y responsables de diferentes canales impiden la implementación de una estrategia omnicanal en toda la empresa. Su independencia entre sí apoya bien el enfoque multicanal de los años anteriores, con métodos de trabajo óptimos y una buena alineación entre el negocio y la TI dentro de cada canal. En particular, esta"}, {"s": "§5 Lecciones aprendidas", "p": 408, "t": "estructura aporta la velocidad y la agilidad necesarias para los enfoques de ventas digitales. Sin embargo, la omnipresencia de la tecnología en la vida de los clientes hoy en día requiere lograr una experiencia de cliente perfecta. Para lograrlo, una empresa necesita permitir una alineación intensiva entre todos los departamentos, una estructura de viaje del cliente, bases de datos fusionadas y una buena capacidad de respuesta a los cambios necesarios (Ovum 2017). DB Vertrieb se reorganiza en función de los recorridos de los clientes e implementa una unidad de gestión omnicanal. La unidad es responsable de gestionar las interacciones con los clientes de forma coherente en todos los canales y de facilitar la alineación entre el negocio y la TI. En lo que respecta a la organización de TI, el caso muestra que una sola función de TI es importante para la armonización y agregación de datos y metodologías, cruciales para una experiencia de cliente personalizada y fluida."}, {"s": "§5 Lecciones aprendidas", "p": 408, "t": "Permite una alineación más coherente dentro de la TI y una integración de los sistemas. Además, la reintegración de las funciones de TI previamente separadas conduce a no tener que construir capacidades ágiles desde cero. Así, la capacidad de reaccionar rápidamente, especialmente a los cambios en los canales digitales, se puede establecer con mayor facilidad. El caso, por lo tanto, indica que una división de TI unimodal y ágil, vista como un socio para el negocio, puede garantizar una experiencia de cliente mejorada y fluida en todos los canales de venta."}, {"s": "§5 Lecciones aprendidas", "p": 408, "t": "Instalar roles de gobernanza y organización particularmente dedicados para la efectividad de la transformación: Un tercer punto interesante se refiere a la transformación de la función de TI como parte del viaje de digitalización en una empresa. Las iniciativas de TI bimodal deben integrarse cuidadosamente con todas las actividades de transformación digital. En DB Vertrieb, la dirección subestima al principio esta complejidad. La reintegración de las funciones de TI, la ampliación del enfoque ágil a toda la unidad de TI y la introducción de una división digital que abarque esta nueva unidad de TI son tres proyectos de transformación masivos. La coordinación y supervisión de estos proyectos se confía a los responsables de DB Vertrieb, además de sus tareas operativas y relacionadas con los contenidos. En esta configuración, las discusiones sobre temas que abarcan departamentos en particular son difíciles y duraderas."}, {"s": "§5 Lecciones aprendidas", "p": 408, "t": "DB Vertrieb opta por implementar un rol de liderazgo dedicado únicamente a coordinar e impulsar actividades de transformación que releva la gestión de esta parte organizativa. Además, la junta de gobierno recientemente establecida proporciona a los administradores una estructura clara para supervisar la reorganización. Las empresas deben implementar roles y estructuras explícitos como estos para permitir y liberar a su gerencia para diseñar la nueva organización y apoyar y guiar a los empleados a través de iniciativas de transformación. De lo contrario, como nos dice la experiencia de DB Vertrieb, el tiempo necesario para poner en marcha la transformación aumenta significativamente."}, {"s": "§5 Lecciones aprendidas", "p": 409, "t": "Hacer obligatorias las capacitaciones sobre metodologías y modelos de colaboración: La compulsividad de las capacitaciones en DB Vertrieb conduce a un alto nivel de compromiso e iniciativa. Una división digital organizada en customer journeys con una unidad de TI reintegrada que trabaja con métodos ágiles es una situación nueva para todos. Las formaciones obligatorias reúnen a todos los empleados y les \"obligan\" a intercambiar experiencias y hablar de nuevos procesos y estructuras. No importa si algunos empleados ya conocen ciertos o todos los"}, {"s": "§5 Lecciones aprendidas", "p": 409, "t": "aspectos de los enfoques o métodos, como Scrum o el proceso de análisis de negocios, el grado y la forma en que se aplican en un contexto específico de la empresa después de una reorganización es nuevo para todos. La formación de cada empleado que tiene que trabajar en un contexto novedoso sobre los mismos temas en los mismos cursos genera niveles más altos de comprensión y simpatía mutua, necesarios para una buena colaboración. Especialmente en la interfaz entre la empresa y la TI, conocer a los clientes y los requisitos es importante para ambas partes. Las capacitaciones obligatorias son una forma de permitir el entendimiento común."}, {"s": "§5 Lecciones aprendidas", "p": 409, "t": "La reintegración de una función de TI bimodal le permite enfatizar los temas centrales de TI necesarios: Después de la reorganización en DB Vertrieb a principios de 2016, la función de TI reintegrada pasa a formar parte de la división digital. La nueva configuración organizacional le da al CIO la oportunidad de incluir temas centrales de TI en la estrategia general de digitalización de la división digital. De ahí que cuestiones como la sustitución de sistemas heredados se integren bajo el paraguas de la digitalización. En general, este tipo de temas son difíciles de aplicar. A pesar de ser esencialmente importante para construir la base de la digitalización, la comprensión de los asuntos básicos de TI es muy limitada dentro de las funciones empresariales, así como a nivel de gestión. Al incorporar temas esenciales de TI en las estrategias de transformación digital, los ejecutivos de TI pueden evitar la falta de comunicación y la incomprensión."}, {"s": "§5 Lecciones aprendidas", "p": 409, "t": "Además, pueden aumentar la prioridad de los temas. Una posible forma de hacerlo la demuestra DB Vertrieb, en este caso con la integración de ambas funciones informáticas en una sola, que se asigna a la división digital y a su estrategia."}, {"s": "§5 Lecciones aprendidas", "p": 409, "t": "Por último, nos gustaría mencionar que los resultados del caso siempre deben considerarse teniendo en cuenta el contexto específico de una empresa. DB Vertrieb es responsable de las actividades de ventas como parte de una gran corporación dentro de la industria del transporte de pasajeros. Los estándares legales y las reglas de seguridad en otras industrias y para otras funciones corporativas pueden ser diferentes, inhibiendo o facilitando una vía de transformación de TI como la de DB Vertrieb. Además, el tamaño de la empresa podría influir a la hora de evaluar la aplicabilidad de los resultados. Las empresas más pequeñas y sus TI las funciones a menudo ya utilizan prácticas ágiles informales o son demasiado pequeñas para separarlas en dos funciones de TI. En el caso de las empresas más grandes, hay que tener en cuenta el tema de la externalización. Muchas empresas han externalizado partes o incluso todas sus actividades de TI."}, {"s": "§5 Lecciones aprendidas", "p": 409, "t": "Estos entornos pueden conducir a vías muy diferentes de transformación de TI. Sin embargo, creemos que nuestros hallazgos pueden proporcionar una orientación relevante y detallada a los responsables de la toma de decisiones que navegan a través de la transformación digital utilizando un enfoque de TI bimodal."}]</script>

requirements submitted to the IT team", "g": "Process Efficiency"}, {"v": "num_requirements_approved", "d": "Number of submitted requirements that were approved for development", "g": "Process Efficiency / Decision Speed"}, {"v": "formal_agile_framework", "d": "The agile (or non-agile) methodology officially adopted by the team", "g": "Flexibility & Agile Adoption"}, {"v": "num_sprint_teams_active", "d": "Number of active sprint teams operating within the team/department", "g": "Flexibility & Agile Adoption"}, {"v": "sprint_velocity_story_points", "d": "Total story points completed by the team in the month (agile throughput metric)", "g": "Process Efficiency / Flexibility"}, {"v": "sprint_completion_rate_pct", "d": "Percentage of planned story points completed within the sprint/commitment period", "g": "Process Efficiency / Flexibility"}, {"v": "num_retrospectives_held", "d": "Number of retrospective meetings conducted in the month", "g": "Flexibility & Agile Adoption"}, {"v": "agile_training_hours_per_employee", "d": "Average hours of agile methodology training per employee in the team for that month", "g": "Flexibility & Agile Adoption / Employee Engagement"}, {"v": "total_training_hours_team", "d": "Total training hours delivered to the team (headcount × per-employee hours)", "g": "Flexibility & Agile Adoption"}, {"v": "num_crossfunctional_projects", "d": "Number of projects involving collaboration across multiple teams or channel types", "g": "Flexibility & Agile Adoption / Process Efficiency"}, {"v": "pct_team_crossfunctional_members", "d": "Percentage of team members coming from mixed backgrounds (former Online IT + Traditional IT)", "g": "Flexibility & Agile Adoption / Employee Engagement"}, {"v": "cross_functional_camps_attended", "d": "Number of cross-functional camps (team-building/workshops) attended by team members", "g": "Flexibility & Agile Adoption / Employee Engagement"}, {"v": "safe_program_increment_planned", "d": "Whether a SAFe Program Increment was planned in this month (quarterly cadence)", "g": "Flexibility & Agile Adoption"}, {"v": "safe_adoption_maturity_score_1to10", "d": "Self-assessed or auditor-assessed maturity score of SAFe implementation", "g": "Flexibility & Agile Adoption"}, {"v": "employee_satisfaction_score_1to10", "d": "Average employee satisfaction score from internal surveys", "g": "Employee Engagement & Commitment"}, {"v": "voluntary_turnover_pct", "d": "Percentage of employees who voluntarily left the team/role in that month", "g": "Employee Engagement & Commitment"}, {"v": "num_employee_innovation_proposals", "d": "Number of innovation ideas or improvement proposals submitted by employees", "g": "Employee Engagement & Commitment"}, {"v": "num_mandatory_training_sessions", "d": "Number of mandatory training sessions conducted that month", "g": "Employee Engagement & Commitment / Flexibility"}, {"v": "product_owner_decision_autonomy_score_1to10", "d": "Degree of decision-making autonomy granted to product owners", "g": "Decision Speed & Initiative Implementation"}, {"v": "num_governance_board_meetings", "d": "Number of transformation governance board meetings held", "g": "Decision Speed & Initiative Implementation"}, {"v": "devops_integration_sessions", "d": "Number of DevOps integration/collaboration sessions between development and operations", "g": "Process Efficiency / Flexibility"}, {"v": "num_change_management_initiatives", "d": "Number of change management activities or communications launched", "g": "Employee Engagement / Decision Speed"}, {"v": "transformation_backlog_items_completed", "d": "Number of items marked as Done on the transformation backlog", "g": "Decision Speed & Initiative Implementation"}, {"v": "num_innovation_lab_workshops", "d": "Number of workshops or sessions held in innovation laboratories", "g": "Flexibility & Agile Adoption / Employee Engagement"}, {"v": "pct_positions_filled_externally", "d": "Percentage of open positions filled with external hires (vs. i <script>
window.vtInit=function(root){
"use strict";
const $=id=>root.querySelector("#"+id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STR=new Set(["team_name","it_unit_type","channel_type","formal_agile_framework"]);
const lines=document.getElementById("vt-csv").textContent.trim().split(/\r?\n/);
const COLS=lines[0].split(",");
const ROWS=lines.slice(1).map(l=>{const p=l.split(","),o={};COLS.forEach((c,i)=>o[c]=STR.has(c)?p[i]:+p[i]);return o});
const KB=JSON.parse(document.getElementById("vt-kb").textContent), DICT=JSON.parse(document.getElementById("vt-dict").textContent);
const NUM=COLS.filter(c=>!STR.has(c)&&!["observation_id","year","month","fiscal_quarter"].includes(c));

const UNITS=[["Online_IT","TI en línea","--s1"],["Traditional_IT","TI tradicional","--s2"],["Reintegrated_IT","TI reintegrada","--s3"]];
const UL=Object.fromEntries(UNITS.map(u=>[u[0],u[1]])), UC=Object.fromEntries(UNITS.map(u=>[u[0],"var("+u[2]+")"]));
const TEAM={Web_Platform:"Plataforma web",Mobile_App:"App móvil",Customer_Portal:"Portal del cliente",Backend_Systems:"Sistemas backend",Travel_Centers:"Centros de viajes",Vending_Machines:"Máquinas expendedoras",Journey_Planning:"Planificación del viaje",Ticketing_Fulfillment:"Emisión de billetes",Post_Purchase_Service:"Servicio posventa",Omni_Channel_Mgmt:"Gestión omnicanal"};
const TEAM_UNIT={};ROWS.forEach(r=>TEAM_UNIT[r.team_name]=r.it_unit_type);
// métricas disponibles para KR: [etiqueta, unidad, decimales, escala]
const M={
 avg_requirements_to_production_days:["Días de requisito a producción","días",0,1],
 avg_bug_fix_resolution_days:["Días para corregir un error","días",1,1],
 release_frequency_target_met:["Meses que cumplen la cadencia de lanzamientos","%",0,100],
 num_releases_deployed:["Lanzamientos por equipo y mes","",2,1],
 num_complex_releases:["Lanzamientos complejos por equipo y mes","",2,1],
 num_patch_deployments:["Parches por equipo y mes","",1,1],
 system_uptime_pct:["Disponibilidad de sistemas","%",2,1],
 sprint_completion_rate_pct:["Sprints completados","%",0,1],
 sprint_velocity_story_points:["Velocidad de sprint (puntos de historia)","",0,1],
 safe_adoption_maturity_score_1to10:["Madurez SAFe (0–10)","",1,1],
 product_owner_decision_autonomy_score_1to10:["Autonomía del product owner (1–10)","",1,1],
 employee_satisfaction_score_1to10:["Satisfacción del empleado (1–10)","",1,1],
 voluntary_turnover_pct:["Rotación voluntaria","%",1,1],
 agile_training_hours_per_employee:["Horas de formación ágil por empleado","h",1,1],
 pct_team_crossfunctional_members:["Miembros de origen mixto en el equipo","%",0,1],
 num_crossfunctional_projects:["Proyectos multifuncionales","",1,1],
 transformation_backlog_items_completed:["Ítems del backlog de transformación hechos","",1,1],
 pct_positions_filled_externally:["Vacantes cubiertas con externos","%",0,1],
 num_employee_innovation_proposals:["Propuestas de innovación de empleados","",1,1],
 pct_digital_channel_revenue:["Ingresos por canales digitales","%",0,1],
 num_customer_complaints_digital:["Quejas de clientes, canal digital","",0,1]
};
const nf=(v,d)=>v==null||isNaN(v)?"s. d.":v.toLocaleString("es",{minimumFractionDigits:d,maximumFractionDigits:d});
const fm=(k,v)=>nf(v,M[k][2])+(M[k][1]==="%"?" %":M[k][1]?" "+M[k][1]:"");
const mean=(rows,k)=>{if(!rows.length)return null;let s=0;for(const r of rows)s+=r[k];return s/rows.length*(M[k]?M[k][3]:1)};

// ---------- estado ----------
const YEARS=[...new Set(ROWS.map(r=>r.year))].sort();
const S={y0:YEARS[0],y1:YEARS[YEARS.length-1],units:new Set(UNITS.map(u=>u[0])),team:"all",q:0};
function filtered(){return ROWS.filter(r=>r.year>=S.y0&&r.year<=S.y1&&S.units.has(r.it_unit_type)&&(S.team==="all"||r.team_name===S.team)&&(!S.q||r.fiscal_quarter===S.q))}
function filterText(){
  const u=S.units.size===3?"todas las unidades":[...S.units].map(x=>UL[x]).join(" y ")||"ninguna unidad";
  return S.y0+"–"+S.y1+" · "+u+(S.team!=="all"?" · equipo "+TEAM[S.team]:"")+(S.q?" · solo T"+S.q:"");
}
function years(){return YEARS.filter(y=>y>=S.y0&&y<=S.y1)}

// ---------- OKR ----------
const OKR_DEF={obj:"Convertir la TI reintegrada en un socio ágil que lleve ideas a producción cinco veces más rápido, sin ceder estabilidad.",
 krs:[{name:"Reducir el tiempo de requisito a producción de 109 a 22 días",metric:"avg_requirements_to_production_days",base:108.8,target:21.8},
      {name:"Pasar de 1,8 a 4 lanzamientos por equipo y mes, una cadencia semanal",metric:"num_releases_deployed",base:1.81,target:4},
      {name:"Corregir errores en 5 días en lugar de 52",metric:"avg_bug_fix_resolution_days",base:51.7,target:5}]};
let OKR=JSON.parse(JSON.stringify(OKR_DEF));
try{const s=JSON.parse(localStorage.getItem("okr-dbv")||"null");if(s&&s.krs&&s.krs.length)OKR=s}catch(e){}
function okrState(rows){
  const yl=rows.length?Math.max(...rows.map(r=>r.year)):null, last=rows.filter(r=>r.year===yl);
  const krs=OKR.krs.map(k=>{const cur=mean(last,k.metric);let p=null;
    if(cur!=null&&k.target!==k.base)p=Math.max(0,Math.min(1,(cur-k.base)/(k.target-k.base)));
    return {...k,cur,p,st:status(p)}});
  const ps=krs.filter(k=>k.p!=null).map(k=>k.p), avg=ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null;
  return {yl,krs,avg,st:status(avg)};
}
function status(p){if(p==null)return ["warn","– Sin datos"];if(p>=1)return ["good","✓ Logrado"];if(p>=.7)return ["good","● En curso"];if(p>=.4)return ["warn","▲ En riesgo"];return ["bad","■ Rezagado"]}
function renderOKR(rows){
  const o=okrState(rows);
  $("okr-obj").textContent=OKR.obj;
  $("okr-scope").textContent=o.yl?"Valor actual: promedio de "+o.yl+" con los filtros activos. Línea base: toda la TI en 2015, último año completo del modelo bimodal separado.":"Sin datos con los filtros activos.";
  $("okr-pct").textContent=o.avg==null?"–":Math.round(o.avg*100)+" %";
  $("okr-pill").innerHTML='<span class="pill '+o.st[0]+'">'+o.st[1]+"</span>";
  $("krs").innerHTML=o.krs.map((k,i)=>'<div class="kr"><div class="vt-eyebrow">Resultado clave '+(i+1)+'</div><div class="t">'+esc(k.name)+'</div>'+
    '<div class="bar" role="img" aria-label="Avance '+(k.p==null?"sin datos":Math.round(k.p*100)+" %")+'"><span style="width:'+(k.p==null?0:Math.round(k.p*100))+'%"></span></div>'+
    '<div class="nums"><span>Base '+fm(k.metric,k.base)+'</span><span>Actual <b>'+fm(k.metric,k.cur)+'</b></span><span>Meta '+fm(k.metric,k.target)+'</span></div>'+
    '<div class="foot"><span class="pill '+k.st[0]+'">'+k.st[1]+'</span><span>'+(k.p==null?"":Math.round(k.p*100)+" % del recorrido")+'</span></div></div>').join("");
  return o;
}
function openEditor(){
  const f=$("okr-form");f.hidden=false;
  const opts=k=>Object.keys(M).map(m=>'<option value="'+m+'"'+(m===k?" selected":"")+'>'+esc(M[m][0])+'</option>').join("");
  f.innerHTML='<label>Objetivo<input id="oe-obj" value="'+esc(OKR.obj)+'"></label><div id="oe-rows" style="display:flex;flex-direction:column;gap:10px">'+
    OKR.krs.map((k,i)=>krRow(k,i,opts)).join("")+'</div><div class="row"><button class="vt-btn" type="submit">Guardar OKR</button><button class="vt-btn ghost" type="button" id="oe-add">Añadir resultado clave</button><button class="vt-btn ghost" type="button" id="oe-def">Restaurar propuesta</button><button class="linkbtn" type="button" id="oe-cancel">Cancelar</button></div><p class="sec-note">La base y la meta se expresan en la unidad de la variable. El avance se calcula como (actual − base) / (meta − base).</p>';
  $("oe-add").onclick=()=>{collect();OKR.krs.push({name:"Nuevo resultado clave",metric:"system_uptime_pct",base:99.5,target:99.8});openEditor()};
  $("oe-def").onclick=()=>{OKR=JSON.parse(JSON.stringify(OKR_DEF));save();f.hidden=true;update()};
  $("oe-cancel").onclick=()=>{try{const s=JSON.parse(localStorage.getItem("okr-dbv")||"null");OKR=s&&s.krs?s:OKR}catch(e){}f.hidden=true;update()};
  f.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{collect();OKR.krs.splice(+b.dataset.del,1);openEditor()});
}
function krRow(k,i,opts){return '<div class="krrow"><label>Resultado clave '+(i+1)+'<input id="oe-n'+i+'" value="'+esc(k.name)+'"></label><label>Variable<select id="oe-m'+i+'">'+opts(k.metric)+'</select></label><label>Base<input id="oe-b'+i+'" type="number" step="any" value="'+k.base+'"></label><label>Meta<input id="oe-t'+i+'" type="number" step="any" value="'+k.target+'"></label><button class="linkbtn" type="button" data-del="'+i+'">Quitar</button></div>'}
function collect(){OKR.obj=$("oe-obj").value.trim()||OKR.obj;OKR.krs=OKR.krs.map((k,i)=>({name:$("oe-n"+i).value.trim()||k.name,metric:$("oe-m"+i).value,base:parseFloat($("oe-b"+i).value)||0,target:parseFloat($("oe-t"+i).value)||0}))}
function save(){try{localStorage.setItem("okr-dbv",JSON.stringify(OKR))}catch(e){}}
$("okr-edit").onclick=()=>{$("okr-form").hidden?openEditor():($("okr-form").hidden=true)};
$("okr-form").addEventListener("submit",e=>{e.preventDefault();collect();save();$("okr-form").hidden=true;update()});

// ---------- gráficos ----------
function ticks(a,b,n){if(a===b){b=a+1}const st0=(b-a)/n,mg=Math.pow(10,Math.floor(Math.log10(st0))),e=st0/mg,st=(e>=5?10:e>=2?5:e>=1?2:1)*mg;
  const lo=Math.floor(a/st)*st,hi=Math.ceil(b/st)*st,t=[];for(let v=lo;v<=hi+st/2;v+=st)t.push(+v.toFixed(6));return t}
function tipAt(fig,html,x,y){let t=fig.querySelector(".tip");if(!t){t=document.createElement("div");t.className="tip";fig.appendChild(t)}
  t.innerHTML=html;t.hidden=false;const fw=fig.clientWidth,tw=t.offsetWidth;t.style.left=Math.max(0,Math.min(fw-tw,x+12))+"px";t.style.top=Math.max(0,y-t.offsetHeight-10)+"px"}
function tipOff(fig){const t=fig.querySelector(".tip");if(t)t.hidden=true}
function drawLine(fig,plot,c){
  const W=Math.max(280,plot.clientWidth||520),H=240,m={l:42,r:12,t:16,b:24},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const all=c.series.flatMap(s=>s.vals).filter(v=>v!=null);if(c.ref)all.push(c.ref.v);
  if(!all.length){plot.innerHTML='<p class="empty">Sin datos para esta selección.</p>';return}
  let lo=c.yMin!=null?c.yMin:Math.min(0,...all),hi=Math.max(...all);if(c.yMin==="auto"){lo=Math.min(...all)}
  const tk=ticks(lo,hi,4);lo=tk[0];hi=tk[tk.length-1];
  const n=c.x.length,X=i=>m.l+(n===1?iw/2:i*iw/(n-1)),Y=v=>m.t+ih-(v-lo)/(hi-lo)*ih;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(c.title)+'">';
  tk.forEach(t=>{s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" style="stroke:var(--grid)" stroke-width="1"/><text x="'+(m.l-6)+'" y="'+(Y(t)+4)+'" text-anchor="end">'+nf(t,c.dec>1&&hi-lo<5?1:0)+'</text>'});
  const step=Math.ceil(n/Math.max(1,Math.floor(iw/44)));
  c.x.forEach((l,i)=>{if(i%step===0)s+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">'+l+'</text>'});
  const i16=c.x.indexOf(2016);
  if(i16>0){s+='<line x1="'+X(i16)+'" x2="'+X(i16)+'" y1="'+m.t+'" y2="'+(m.t+ih)+'" style="stroke:var(--faint)" stroke-dasharray="3 3"/><text x="'+(X(i16)-5)+'" y="'+(m.t-5)+'" text-anchor="end" style="fill:var(--fg);font-weight:600">Fusión de TI, 2016</text>'}
  if(c.ref){s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(c.ref.v)+'" y2="'+Y(c.ref.v)+'" style="stroke:var(--fg)" stroke-dasharray="5 4" stroke-width="1.2"/><text x="'+(m.l+4)+'" y="'+(Y(c.ref.v)-5)+'" style="fill:var(--fg);font-weight:600">'+esc(c.ref.label)+'</text>'}
  c.series.forEach(sr=>{let d="",pen=false,lastI=-1;sr.vals.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);pen=true;lastI=i});
    s+='<path d="'+d+'" fill="none" style="stroke:'+sr.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"'+(sr.dash?' stroke-dasharray="6 4"':'')+'/>';
    sr.vals.forEach((v,i)=>{if(v!=null&&(i===lastI||n<=6||(sr.vals[i-1]==null&&sr.vals[i+1]==null)))s+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="'+(i===lastI?4:3)+'" style="fill:'+sr.color+';stroke:var(--bg)" stroke-width="2"/>'})});
  s+='<line class="xh" y1="'+m.t+'" y2="'+(m.t+ih)+'" style="stroke:var(--fg)" stroke-width="1" visibility="hidden"/><rect x="'+m.l+'" y="'+m.t+'" width="'+iw+'" height="'+ih+'" fill="transparent" class="hit"/></svg>';
  plot.innerHTML=s;const svg=plot.firstChild,xh=svg.querySelector(".xh"),hit=svg.querySelector(".hit");
  const mv=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;let i=n===1?0:Math.round((px-m.l)/iw*(n-1));i=Math.max(0,Math.min(n-1,i));
    xh.setAttribute("x1",X(i));xh.setAttribute("x2",X(i));xh.setAttribute("visibility","visible");
    const fr=fig.getBoundingClientRect();
    tipAt(fig,"<b>"+c.x[i]+"</b><br>"+c.series.filter(sr=>sr.vals[i]!=null).map(sr=>'<i style="--c:'+sr.color+'"></i>'+esc(sr.name)+": <b>"+c.fmt(sr.vals[i])+"</b>").join("<br>"),r.left-fr.left+X(i)/W*r.width,e.clientY-fr.top)};
  hit.addEventListener("pointermove",mv);hit.addEventListener("pointerdown",mv);hit.addEventListener("pointerleave",()=>{xh.setAttribute("visibility","hidden");tipOff(fig)});
}
function drawBars(fig,plot,c){
  if(!c.items.length){plot.innerHTML='<p class="empty">Sin datos para esta selección.</p>';return}
  const W=Math.max(280,plot.clientWidth||520),rh=26,m={l:148,r:54,t:4,b:4},H=m.t+m.b+rh*c.items.length,iw=W-m.l-m.r,mx=Math.max(...c.items.map(d=>d.v))||1;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(c.title)+'">';
  c.items.forEach((d,i)=>{const y=m.t+i*rh,w=Math.max(2,d.v/mx*iw);
    s+='<g class="b" data-i="'+i+'"><rect x="0" y="'+y+'" width="'+W+'" height="'+rh+'" fill="transparent"/><text x="'+(m.l-8)+'" y="'+(y+rh/2+4)+'" text-anchor="end" style="fill:var(--fg)">'+esc(d.name)+'</text><rect x="'+m.l+'" y="'+(y+5)+'" width="'+w+'" height="'+(rh-10)+'" rx="3" style="fill:'+d.color+'"/><text x="'+(m.l+w+6)+'" y="'+(y+rh/2+4)+'" style="fill:var(--fg);font-weight:600">'+c.fmt(d.v)+'</text></g>'});
  plot.innerHTML=s+'</svg>';
  plot.querySelectorAll(".b").forEach(g=>{const d=c.items[+g.dataset.i];const mv=e=>{const fr=fig.getBoundingClientRect();tipAt(fig,"<b>"+esc(d.name)+"</b><br>"+esc(d.group)+"<br>"+c.fmt(d.v)+" · "+d.n+" meses",e.clientX-fr.left,e.clientY-fr.top)};
    g.addEventListener("pointermove",mv);g.addEventListener("pointerdown",mv);g.addEventListener("pointerleave",()=>tipOff(fig))});
}
function drawScatter(fig,plot,c){
  if(!c.pts.length){plot.innerHTML='<p class="empty">Sin datos para esta selección.</p>';return}
  const W=Math.max(280,plot.clientWidth||520),H=260,m={l:50,r:14,t:12,b:38},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const tx=ticks(0,Math.max(...c.pts.map(p=>p.x)),5),ty=ticks(Math.min(...c.pts.map(p=>p.y)),Math.max(...c.pts.map(p=>p.y)),4);
  const X=v=>m.l+(v-tx[0])/(tx[tx.length-1]-tx[0])*iw,Y=v=>m.t+ih-(v-ty[0])/(ty[ty.length-1]-ty[0])*ih;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(c.title)+'">';
  ty.forEach(t=>s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" style="stroke:var(--grid)"/><text x="'+(m.l-6)+'" y="'+(Y(t)+4)+'" text-anchor="end">'+nf(t,1)+'</text>');
  tx.forEach(t=>s+='<text x="'+X(t)+'" y="'+(m.t+ih+15)+'" text-anchor="middle">'+nf(t,0)+'</text>');
  s+='<text x="'+(m.l+iw/2)+'" y="'+(H-4)+'" text-anchor="middle">'+esc(c.xl)+'</text><text x="'+m.l+'" y="'+(m.t-2)+'" text-anchor="start">'+esc(c.yl)+'</text>';
  c.pts.forEach((p,i)=>s+='<circle data-i="'+i+'" cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="4.5" style="fill:'+p.color+';stroke:var(--bg)" stroke-width="1.5" fill-opacity=".85"/>');

function hdSemaforo(v) {
  if (v <= 40) return { label: "Rojo", cls: "rojo", color: "#d9362d" };
  if (v <= 70) return { label: "Amarillo", cls: "amarillo", color: "#e5a221" };
  return { label: "Verde", cls: "verde", color: "#1f9d55" };
}

const hdBands = {
  id: "semaforoBands",
  beforeDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    if (!chartArea) return;
    const y = scales.y;
    [[0, 40, "rgba(217,54,45,0.06)"], [40, 70, "rgba(229,162,33,0.08)"], [70, 100, "rgba(31,157,85,0.08)"]].forEach(([a, b, c]) => {
      const top = y.getPixelForValue(b), bottom = y.getPixelForValue(a);
      ctx.save(); ctx.fillStyle = c;
      ctx.fillRect(chartArea.left, top, chartArea.right - chartArea.left, bottom - top);
      ctx.restore();
    });
  },
};

/* Crea o recrea un gráfico de Chart.js sobre un <canvas> */
function useChart(ref, build, deps) {
  useEffect(() => {
    if (!ref.current || !window.Chart) return;
    const chart = new window.Chart(ref.current.getContext("2d"), build());
    return () => chart.destroy();
  }, deps);
}

function hdLineOpts(extraScales, legendSize = 10) {
  return {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: "index", intersect: false },
    plugins: { legend: { position: "bottom", labels: { boxWidth: 10, boxHeight: 10, font: { size: legendSize } } } },
    scales: extraScales,
  };
}
